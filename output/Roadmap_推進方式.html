<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>遊喜樂｜推進路線</title>
  <!-- 回答：免費日常服務如何逐步接上區域搭車促銷與展會合作。
       本頁為三階段推進提案，供討論與併入簡報，不改寫既有產品契約或時程。
       視覺參考：使用者提供的 v1.pdf；色票沿用「第七頁_服務架構圖.html」。
       yoxi 標誌取自 v1.pdf 第 13 頁原始影像，內嵌以支援離線開啟。
       單一 HTML，?present=1 顯示純投影片；文字、流程線均可直接編輯。
       刻意不填未驗證的成長數字、預算與月份，也不假設合作已成立。 -->
  <style>
    :root {
      --paper: #eef0e7;
      --white: #fffefa;
      --ink: #302e2a;
      --muted: #706f65;
      --brown: #8e5b3d;
      --brown-soft: #f2e8de;
      --green: #45654b;
      --green-soft: #e4ebdf;
      --line: #d8d9cd;
      --wire: #9d8976;
      --navy: #062040;
      --red: #e60020;
      --screen: #dfe2d9;
      --r-card: 8px;
      --r-btn: 4px;
      --font: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { padding: 20px 28px; background: var(--screen); color: var(--ink); font-family: var(--font); }
    .toolbar { max-width: 1600px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .toolbar p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
    .toolbar strong { margin-right: 12px; color: var(--ink); font-size: 14px; }
    .controls { display: flex; gap: 8px; flex-shrink: 0; }
    button { border: 1px solid var(--navy); border-radius: var(--r-btn); padding: 8px 15px; background: transparent; color: var(--navy); font: 14px var(--font); cursor: pointer; }
    button:first-child { background: var(--navy); color: var(--white); }
    button:hover { opacity: .8; }
    button:focus-visible { outline: 3px solid var(--brown); outline-offset: 3px; }
    .stage { width: min(100%, calc((100vh - 108px) * 16 / 9)); max-width: 1600px; margin: 0 auto; aspect-ratio: 16 / 9; background: var(--paper); box-shadow: 0 12px 42px rgb(39 47 30 / 12%); }
    #slide { width: 100%; height: 100%; display: block; }
    svg text { font-family: var(--font); fill: var(--ink); }
    .nav { font-size: 15px; font-weight: 700; fill: var(--muted); }
    .nav-current { fill: var(--white); }
    .eyebrow { font-size: 20px; font-weight: 700; fill: var(--brown); }
    .headline { font-size: 39px; font-weight: 700; }
    .subtitle { font-size: 23px; fill: var(--muted); }
    .phase { font-size: 21px; font-weight: 700; fill: var(--brown); }
    .number { font: italic 700 21px Arial, sans-serif; fill: var(--white); }
    .phase-title { font-size: 36px; font-weight: 700; }
    .phase-value { font-size: 25px; font-weight: 700; fill: var(--brown); }
    .body-copy { font-size: 22px; fill: var(--muted); }
    .row-label { font-size: 19px; font-weight: 700; fill: var(--brown); letter-spacing: 2px; }
    .reward { font-size: 27px; font-weight: 700; }
    .reward-copy { font-size: 21px; fill: var(--muted); }
    .check-title { font-size: 24px; font-weight: 700; fill: var(--green); }
    .check-copy { font-size: 21px; fill: var(--muted); }
    .footer { font-size: 16px; fill: var(--muted); }
    .route { fill: none; stroke: var(--wire); stroke-width: 2; }
    .hint { max-width: 1600px; margin: 12px auto 0; text-align: center; color: var(--muted); font-size: 12px; }
    .status { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); max-width: calc(100vw - 24px); padding: 10px 18px; border-radius: var(--r-card); background: var(--navy); color: var(--white); font-size: 14px; }
    .status:empty { display: none; }
    :fullscreen body, html.present body { padding: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); }
    :fullscreen .toolbar, :fullscreen .hint, html.present .toolbar, html.present .hint { display: none; }
    :fullscreen .stage, html.present .stage { width: min(100vw, calc(100vh * 16 / 9)); max-width: none; margin: 0; box-shadow: none; }
    @media (max-width: 650px) {
      body { padding: 14px 12px; }
      .toolbar { align-items: flex-start; gap: 8px; }
      .toolbar strong { display: block; margin: 0; }
      button { padding: 8px 10px; }
      .stage { width: 100%; }
      .hint { line-height: 1.6; }
    }
    @media print {
      @page { size: 16in 9in; margin: 0; }
      html, body, html.present body { display: block; width: 16in; height: 9in; min-height: 0; padding: 0; background: var(--paper); print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .toolbar, .hint, .status { display: none; }
      .stage, html.present .stage { width: 16in; height: 9in; max-width: none; margin: 0; box-shadow: none; break-inside: avoid; }
    }
  </style>
</head>

      <g id="phase-one">

        <text x="70" y="331" class="phase-title">免費服務</text>
        <text x="70" y="373" class="phase-value">讓人願意常回來</text>
        <text x="70" y="420" class="body-copy">看地方、回看收藏與製作回憶卡</text>
        <text x="70" y="455" class="body-copy">有出門意願，就能接上 yoxi</text>
      </g>
      <g id="phase-two">
        <text x="566" y="232" class="phase">中期</text>
        <text x="566" y="331" class="phase-title">區域搭車促銷</text>
        <text x="566" y="373" class="phase-value">讓想去變成出發</text>
        <text x="566" y="420" class="body-copy">選定生活圈與商圈，推出主題路線</text>
        <text x="566" y="455" class="body-copy">搭配指定區域或時段的搭車優惠</text>
      </g>
      <g id="phase-three">

        <text x="1062" y="331" class="phase-title">展會活動合作</text>
        <text x="1062" y="373" class="phase-value">把出行接進活動</text>
        <text x="1062" y="420" class="body-copy">串接文化展覽、花季與地方活動</text>
        <text x="1062" y="455" class="body-copy">整合前往、回程與合作方權益</text>
      </g>

        <text x="566" y="585" class="reward">區域系列卡＋搭車回饋</text>
        <text x="566" y="624" class="reward-copy">以主題收藏增加出行動機</text>
        <text x="1062" y="585" class="reward">活動紀念卡＋合作禮遇</text>
        <text x="1062" y="624" class="reward-copy">合作方共同提供內容與回饋</text>
