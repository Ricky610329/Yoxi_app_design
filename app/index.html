<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yoxi 城事</title>
<!--
  yoxi 城事 web app — 單一入口（契約見 ARCHITECTURE.md §2、§4）

  回答什麼：把 prototype/ 的「合一版」決定做成一個真的能走完一圈的單頁 app。
  動了什麼：只有這個入口、css/app.css、js/app.js；共用的樣式與腳本全部從 ../prototype/ 只讀載入。
  刻意沒有的東西：ES module（file:// 會被 CORS 擋）、CDN、webfont、任何網路請求。
-->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FF2E1A">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="城事">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="../prototype/css/tokens.css">
<link rel="stylesheet" href="../prototype/css/base.css">
<link rel="stylesheet" href="../prototype/css/components.css">
<link rel="stylesheet" href="../prototype/css/chengshi.css">

<link rel="stylesheet" href="css/views/system.css">

<link rel="stylesheet" href="css/views/explore.css">

<link rel="stylesheet" href="css/views/album.css">
<link rel="stylesheet" href="css/views/album-rewards.css">
</head>

<body>
<div id="app">
  <div class="stage">
    <div class="device">
      <div class="device__screen">
        <div id="view"></div>
      </div>
      <nav class="tabbar" id="tabbar" hidden></nav>
    </div>
    <aside id="demo-panel" aria-label="demo 工具"></aside>
  </div>
</div>
<pre id="app-errors" hidden></pre>

<script src="../prototype/js/icons.js"></script>

<script src="../prototype/js/hsmap.js"></script>
<script src="../prototype/assets/photos/credits.js"></script>

<script>window.PHOTOS_BASE = '../prototype/assets/photos/';</script>
<script src="../prototype/js/photos.js"></script>

<script src="js/views/explore-unlock.js"></script>
<script src="js/views/album.js"></script>
<script src="js/views/album-rewards.js"></script>

</html>
