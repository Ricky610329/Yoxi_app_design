<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>全站稽核 — 死按鈕與數字矛盾</title>
<!--
  兩類「不會報錯、只會安靜出錯」的問題，全站掃一次。

    chrome --headless=new --allow-file-access-from-files \
           --virtual-time-budget=90000 --dump-dom tools/audit-app.html

  為什麼要有這一份：console 全綠、斷連為零、六條防護承諾全過 —— 然後
  五份人工稽核一次抓到 57 個「看起來可按、實際沒有任何行為」的元素，
  以及四組「同一個數字在不同畫面互相打架」。兩類都不會讓任何既有檢查變紅。

  A 死按鈕：在 iframe 裡攔截 addEventListener 與 onclick 的指派，
  然後掃全頁的可按元素，看每一個要嘛有真的 href、要嘛留下了綁定紀錄。
  攔截必須在頁面自己的腳本跑之前裝好，所以用 about:blank + document.write。

  B 數字矛盾：同一份狀態下載入多個畫面，把它們各自算出來的獎章進度、
  點數、去過幾個地方、覆蓋率抓出來比對。
-->
<style>
  body { font: 13px/1.7 ui-monospace, Menlo, Consolas, monospace; margin: 24px; }
  iframe { width: 390px; height: 844px; border: 0; position: absolute; left: -9999px; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<pre id="out">跑中…</pre>
<div id="frames"></div>

<script>
const BASE = '../screens/';

/* 這些 href 是刻意的「沒有下一步」：demo 外殼、或是靠 JS 攔下來的。 */
const OK_HASH = new Set(['nextBtn']);

/* 等頁內排在 DOMContentLoaded 之後的程式跑完（見 shell.js 的 SHELL.ready）。 */
function whenReady(doc, fn) {
  const t0 = Date.now();
  (function poll() {
    if (doc.documentElement.hasAttribute('data-shell-ready') || Date.now() - t0 > 5000) fn();
    else setTimeout(poll, 60);
  })();
}

function load(url, fn) {
  const fr = document.createElement('iframe');
  fr.src = BASE + url;
  fr.onload = function () { whenReady(fr.contentDocument, function () { fn(fr.contentDocument, fr); }); };
  document.getElementById('frames').appendChild(fr);
}

/* ---------------------------------------------------------- A 死按鈕 ---- */
function deadClicks(doc) {
  const dead = [];
  const seen = new Set();

  doc.querySelectorAll('a, button, [role="button"]').forEach(function (el) {
    if (seen.has(el)) return;
    seen.add(el);
    /* <div class="row-nav"> 是版面用的列，不是控制項 ——
       設定頁的每一列都長這樣，但真正可按的是列裡面那顆開關。
       只認 <a>、<button> 與明確標了 role="button" 的東西。 */

    /* 有真的去處就算數 */
    const href = el.getAttribute && el.getAttribute('href');
    if (href && href !== '#' && href.indexOf('javascript:') !== 0) return;

    /* 有任何一種「按了會發生事」的痕跡就算數 */
    if (el.onclick) return;
    if (el.__bound) return;                       /* 攔截器記下的 addEventListener */
    if (el.hasAttribute('data-toast')) return;
    if (el.hasAttribute('data-share')) return;
    if (el.hasAttribute('data-switch')) return;
    if (el.hasAttribute('data-recenter')) return;
    if (el.hasAttribute('data-flip')) return;
    if (el.hasAttribute('data-reset')) return;
    if (el.hasAttribute('data-tab')) return;      /* pill 由 initPills 統一綁 */
    if (el.hasAttribute('data-span')) return;
    if (el.hasAttribute('data-mode')) return;
    if (el.hasAttribute('data-i')) return;        /* 地圖圖釘由 bindPeek 統一綁 */
    if (el.id && OK_HASH.has(el.id)) return;

    /* 祖先可按也算（整列是一個連結的情況） */
    let p = el.parentElement, up = false;
    while (p && p !== doc.body) {
      const h = p.getAttribute && p.getAttribute('href');
      if ((h && h !== '#') || p.onclick || p.__bound ||
          p.hasAttribute('data-toast') || p.hasAttribute('data-share') ||
          p.hasAttribute('data-i')) { up = true; break; }
      p = p.parentElement;
    }
    if (up) return;

    const label = (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 18)
               || el.getAttribute('aria-label') || el.className || el.tagName;
    dead.push(label);
  });
  return dead;
}

/* ------------------------------------------------------- B 數字矛盾 ---- */
const num = function (el) {
  if (!el) return null;
  const m = (el.textContent || '').match(/-?\d+(\.\d+)?/);
  return m ? m[0] : null;
};

const PROBES = [
  ['album.html', function (d) {
    const n = d.querySelectorAll('.statbar__n');
    return { 去過: num(n[0]), 獎章: num(n[1]), 公里: num(n[2]) };
  }],
  ['variant-a-album.html', function (d) {
    const n = d.querySelectorAll('.statbar__n');
    return { 去過: num(n[0]), 獎章: num(n[1]), 公里: num(n[2]) };
  }],
  ['variant-c-album.html', function (d) {
    const n = d.querySelectorAll('.statbar__n');
    return { 去過: num(n[0]), 獎章: num(n[1]), 公里: num(n[2]), 覆蓋率: num(d.getElementById('cov')) };
  }],
  ['variant-a-map.html', function (d) {
    return { 去過: num(d.getElementById('nPlaces')), 公里: num(d.getElementById('nKm')),
             覆蓋率: num(d.getElementById('cov')) };
  }],
  ['fogmap.html', function (d) { return { 覆蓋率: num(d.getElementById('cov')) }; }],
  ['variant-b-explore.html', function (d) { return { 覆蓋率: num(d.getElementById('cov')) }; }],
  ['points.html', function (d) {
    const rows = d.querySelectorAll('#rows .row-nav').length;
    return { 點數: num(d.getElementById('pts')), 明細合計: String(rows * 50) };
  }],
  ['place.html?id=neiwan', function (d) {
    return { 內灣獎章: (d.getElementById('ringLabel').textContent || '').trim() };
  }],
  ['postcard.html?id=p9', function (d) {
    return { 內灣獎章: (d.getElementById('badgeProg').textContent || '').replace('收集 ', '').trim() };
  }],
  ['route.html?id=rail', function (d) {
    const t = (d.getElementById('rProg') || {}).textContent || '';
    return { 內灣獎章: t.replace(/\s/g, '').replace('站', '') || null };
  }],
];

/* ---------------------------------------------------------------- 跑 ---- */
const SCREENS = [];
/* 掃哪些畫面：由 index 的清單決定會漏掉變體，所以直接列。 */
`home drawer pickup outofarea ride ride-done notify ridesettings points trips export
 payment coupon tasks support shop invite explore map place going routes route fogmap
 album postcard badge week elder settings push unlock lookback
 variant-a-map variant-a-explore variant-a-album variant-b-explore variant-b-album
 variant-c-map variant-c-explore variant-c-album
 variant-d-home variant-d-explore variant-d-album
 variant-e-home variant-e-explore variant-e-album
 variant-f-home variant-f-album`.split(/\s+/).filter(Boolean).forEach(function (s) {
  SCREENS.push(s + '.html');
});

const deadOut = {};
let deadDone = 0;

SCREENS.forEach(function (s) {
  /* 攔截器要在頁面腳本之前裝好，所以先開一個空 iframe、寫進去再導向。 */
  const fr = document.createElement('iframe');
  fr.src = 'about:blank';
  fr.onload = function onblank() {
    fr.onload = null;
    const w = fr.contentWindow;
    const origAdd = w.EventTarget.prototype.addEventListener;
    w.EventTarget.prototype.addEventListener = function (type) {
      if (type === 'click' || type === 'pointerdown') { try { this.__bound = true; } catch (e) {} }
      return origAdd.apply(this, arguments);
    };
    fr.onload = function () {
      whenReady(fr.contentDocument, function () {
        const dead = deadClicks(fr.contentDocument);
        if (dead.length) deadOut[s] = dead;
        if (++deadDone === SCREENS.length) runProbes();
      });
    };
    fr.src = BASE + s;
  };
  document.getElementById('frames').appendChild(fr);
});

function runProbes() {
  const res = {};
  let n = 0;
  PROBES.forEach(function (p) {
    load(p[0], function (d) {
      try { res[p[0]] = p[1](d); } catch (e) { res[p[0]] = { 錯誤: e.message }; }
      if (++n === PROBES.length) report(res);
    });
  });
}

function report(res) {
  const L = [];
  let bad = 0;

  L.push('── A 看起來可按、實際沒有行為的元素 ' + '─'.repeat(20));
  const files = Object.keys(deadOut).sort();
  if (!files.length) {
    L.push('  PASS  ' + SCREENS.length + ' 個畫面，沒有死按鈕');
  } else {
    let total = 0;
    files.forEach(function (f) {
      total += deadOut[f].length;
      L.push('  FAIL  ' + f + '：' + deadOut[f].join('、'));
    });
    L.push('        共 ' + total + ' 個，散在 ' + files.length + ' 個畫面');
    bad += files.length;
  }

  L.push('');
  L.push('── B 同一個數字在不同畫面一不一致 ' + '─'.repeat(20));
  const groups = {};
  Object.keys(res).forEach(function (page) {
    Object.keys(res[page]).forEach(function (k) {
      (groups[k] = groups[k] || []).push([page, res[page][k]]);
    });
  });
  Object.keys(groups).forEach(function (k) {
    const vals = groups[k].filter(function (x) { return x[1] != null; });
    const uniq = Array.from(new Set(vals.map(function (x) { return String(x[1]); })));
    if (uniq.length <= 1) {
      L.push('  PASS  ' + k + ' = ' + (uniq[0] || '—') +
             '（' + vals.length + ' 個畫面一致）');
    } else {
      bad++;
      L.push('  FAIL  ' + k + ' 有 ' + uniq.length + ' 種說法：');
      vals.forEach(function (x) { L.push('          ' + x[0] + ' → ' + x[1]); });
    }
  });

  L.push('');
  L.push(bad ? '共 ' + bad + ' 項未通過。' : '全部通過。');
  document.getElementById('out').textContent = L.join('\n');
}
</script>
</body>
</html>
