<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>全站稽核 — 死按鈕、數字矛盾與詞彙禁用</title>
<!--
  三類「不會報錯、只會安靜出錯」的問題，全站掃一次。

    chrome --headless=new --allow-file-access-from-files \
           --virtual-time-budget=90000 --dump-dom tools/audit-app.html

    tools/audit-app.html?scope=vision   改掃 12 張願景探索稿，只看死按鈕
    tools/audit-app.html?scope=concept  改掃 13 張概念稿（地圖 7 ＋ 好友 6），只看死按鈕

  為什麼要有這一份：console 全綠、斷連為零、六條防護承諾全過 —— 然後
  五份人工稽核一次抓到 57 個「看起來可按、實際沒有任何行為」的元素，
  以及四組「同一個數字在不同畫面互相打架」。三類都不會讓既有檢查變紅。

  A 死按鈕：在 iframe 裡攔截 addEventListener 與 onclick 的指派，
  然後掃全頁的可按元素，看每一個要嘛有真的 href、要嘛留下了綁定紀錄。
  攔截必須在頁面自己的腳本跑之前裝好，所以用 about:blank 再改 src。

  B 數字矛盾：同一份狀態下載入多個畫面，把它們各自算出來的獎章進度、
  點數、去過幾個地方、覆蓋率抓出來比對。

  C 詞彙禁用：整份設計的立場是「城事不是任務」。走 .device 底下算繪後的
  文字節點 —— 不是原始碼。原始碼的註解裡本來就有這些詞在解釋「為什麼
  不用它們」，掃原始碼會把說明本身當成違規。

  兩種「不是 FAIL」的狀態：
    尚未建檔          清單／ROOTS 先登記、畫面還沒畫（載進來沒有 SHELL）。
                      這一行同時就是待辦表。
    探索稿（未稽核）  body[data-vision]。想法草圖，還沒到定稿文案的階段，
                      不進 A／B／C；要單獨看就跑 ?scope=vision。
                      概念稿也掛 body[data-vision="concept-…"]，同理跳過，
                      要單獨看就跑 ?scope=concept。
-->
<style>
  body { font: 13px/1.7 ui-monospace, Menlo, Consolas, monospace; margin: 24px; }
  iframe { width: 390px; height: 844px; border: 0; position: absolute; left: -9999px; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<pre id="out">跑中…</pre>
<div id="frames"></div>

<script>
const BASE = '../screens/';
const SCOPE = new URLSearchParams(location.search).get('scope');
const VISION_SCOPE  = SCOPE === 'vision';
const CONCEPT_SCOPE = SCOPE === 'concept';
/* 兩個 scope 的共同點：只跑 A（死按鈕），而且不因為 body[data-vision] 就跳過 ——
   跳過是預設跑法的事，指名要看的時候當然要看。 */
const SCOPED = VISION_SCOPE || CONCEPT_SCOPE;

/* 這些 href 是刻意的「沒有下一步」：demo 外殼、或是靠 JS 攔下來的。 */
const OK_HASH = new Set(['nextBtn']);

/* 等頁內排在 DOMContentLoaded 之後的程式跑完（見 shell.js 的 SHELL.ready）。 */
function whenReady(doc, fn) {
  const t0 = Date.now();
  (function poll() {
    if (doc.documentElement.hasAttribute('data-shell-ready') || Date.now() - t0 > 5000) fn();
    else setTimeout(poll, 60);
  })();
}

function load(url, fn) {
  const fr = document.createElement('iframe');
  fr.src = BASE + url;
  fr.onload = function () {
    let doc = null;
    try { doc = fr.contentDocument; } catch (e) {}
    if (!doc || !doc.documentElement) return fn(null, fr);
    whenReady(doc, function () { fn(doc, fr); });
  };
  document.getElementById('frames').appendChild(fr);
}

/* ---------------------------------------------------------- A 死按鈕 ---- */
function deadClicks(doc) {
  const dead = [];
  const seen = new Set();

  doc.querySelectorAll('a, button, [role="button"]').forEach(function (el) {
    if (seen.has(el)) return;
    seen.add(el);
    /* <div class="row-nav"> 是版面用的列，不是控制項 ——
       設定頁的每一列都長這樣，但真正可按的是列裡面那顆開關。
       只認 <a>、<button> 與明確標了 role="button" 的東西。 */

    /* 有真的去處就算數 */
    const href = el.getAttribute && el.getAttribute('href');
    if (href && href !== '#' && href.indexOf('javascript:') !== 0) return;

    /* 有任何一種「按了會發生事」的痕跡就算數 */
    if (el.onclick) return;
    if (el.__bound) return;                       /* 攔截器記下的 addEventListener */
    if (el.hasAttribute('data-toast')) return;
    if (el.hasAttribute('data-share')) return;
    if (el.hasAttribute('data-switch')) return;
    if (el.hasAttribute('data-recenter')) return;
    if (el.hasAttribute('data-flip')) return;
    if (el.hasAttribute('data-reset')) return;
    if (el.hasAttribute('data-tab')) return;      /* pill 由 initPills 統一綁 */
    if (el.hasAttribute('data-span')) return;
    if (el.hasAttribute('data-mode')) return;
    if (el.hasAttribute('data-i')) return;        /* 地圖圖釘由 bindPeek 統一綁 */
    if (el.id && OK_HASH.has(el.id)) return;

    /* 祖先可按也算（整列是一個連結的情況） */
    let p = el.parentElement, up = false;
    while (p && p !== doc.body) {
      const h = p.getAttribute && p.getAttribute('href');
      if ((h && h !== '#') || p.onclick || p.__bound ||
          p.hasAttribute('data-toast') || p.hasAttribute('data-share') ||
          p.hasAttribute('data-i')) { up = true; break; }
      p = p.parentElement;
    }
    if (up) return;

    const label = (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 18)
               || el.getAttribute('aria-label') || el.className || el.tagName;
    dead.push(label);
  });
  return dead;
}

/* ------------------------------------------------------- C 詞彙禁用 ---- */
const BANNED = ['任務', '完成', '達成', '挑戰', '每日'];

/* 白名單：這幾張裡的這些字是 yoxi 自己既有的文案，不是城事寫的。 */
const WORD_OK = {
  'tasks.html':            'yoxi 既有的好康任務頁，刻意完全不動',
  'variant-t1-tasks.html': '好康任務頁的變體，詞是 yoxi 的',
  'ride-done.html':        '白名單：yoxi 既有文案（「行程完成」是既有畫面的標題）',
  'drawer.html':           '白名單：抽屜列的是 yoxi 既有功能名稱（「好康任務」）',
  'invite.html':           '白名單：yoxi 既有的邀請頁文案（「首趟完成後」）',
};

/* 走算繪後的文字節點：script／style／template 裡的文字不是給人看的，
   HTML 註解根本不是文字節點 —— 這正是不掃原始碼的原因。 */
function bannedHits(doc) {
  const hits = [];
  const seen = {};
  const found = doc.querySelectorAll('.device');
  const roots = found.length ? Array.prototype.slice.call(found)
                             : (doc.body ? [doc.body] : []);
  roots.forEach(function (root) {
    const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        const p = n.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        if (p.closest('script, style, template, noscript')) return NodeFilter.FILTER_REJECT;
        if (!/\S/.test(n.nodeValue || '')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let n;
    while ((n = walker.nextNode())) {
      const t = n.nodeValue || '';
      BANNED.forEach(function (w) {
        const i = t.indexOf(w);
        if (i < 0) return;
        const ctx = t.slice(Math.max(0, i - 12), i + w.length + 12)
                     .replace(/\s+/g, ' ').trim();
        const key = w + '|' + ctx;
        if (seen[key]) return;
        seen[key] = true;
        hits.push({ word: w, ctx: ctx });
      });
    }
  });
  return hits;
}

/* ------------------------------------------------------- B 數字矛盾 ---- */
const num = function (el) {
  if (!el) return null;
  const m = (el.textContent || '').match(/-?\d+(\.\d+)?/);
  return m ? m[0] : null;
};

const PROBES = [
  ['album.html', function (d) {
    const n = d.querySelectorAll('.statbar__n');
    return { 去過: num(n[0]), 獎章: num(n[1]), 公里: num(n[2]) };
  }],
  ['variant-a-album.html', function (d) {
    const n = d.querySelectorAll('.statbar__n');
    return { 去過: num(n[0]), 獎章: num(n[1]), 公里: num(n[2]) };
  }],
  ['variant-c-album.html', function (d) {
    const n = d.querySelectorAll('.statbar__n');
    return { 去過: num(n[0]), 獎章: num(n[1]), 公里: num(n[2]), 覆蓋率: num(d.getElementById('cov')) };
  }],
  ['variant-a-map.html', function (d) {
    return { 去過: num(d.getElementById('nPlaces')), 公里: num(d.getElementById('nKm')),
             覆蓋率: num(d.getElementById('cov')) };
  }],
  ['fogmap.html', function (d) { return { 覆蓋率: num(d.getElementById('cov')) }; }],
  ['variant-b-explore.html', function (d) { return { 覆蓋率: num(d.getElementById('cov')) }; }],
  ['points.html', function (d) {
    let sum = 0;
    d.querySelectorAll('#rows [data-amt]').forEach(function (e) { sum += Number(e.dataset.amt); });
    return { 點數: num(d.getElementById('pts')), 明細合計: String(sum) };
  }],
  ['place.html?id=neiwan', function (d) {
    return { 內灣獎章: (d.getElementById('ringLabel').textContent || '').trim() };
  }],
  ['postcard.html?id=p9', function (d) {
    return { 內灣獎章: (d.getElementById('badgeProg').textContent || '').replace('收集 ', '').trim() };
  }],
  ['route.html?id=rail', function (d) {
    const t = (d.getElementById('rProg') || {}).textContent || '';
    return { 內灣獎章: t.replace(/\s/g, '').replace('站', '') || null };
  }],
];

/* ---------------------------------------------------------------- 跑 ---- */
/* 掃哪些畫面：由 index 的清單決定會漏掉變體，所以直接列。
   還沒建檔的也照列 —— 這份清單同時是「登記了但還沒畫」的待辦表。 */
const MAIN_LIST =
 'home drawer pickup outofarea ride ride-done notify ridesettings points trips export ' +
 'payment coupon tasks support shop invite explore map place going routes route fogmap ' +
 'album postcard badge week elder settings push unlock lookback ' +
 'place.html?id=neiwan unlock.html?ride=1 push.html?when=night ' +
 'variant-a-map variant-a-explore variant-a-album variant-b-explore variant-b-album ' +
 'variant-c-map variant-c-explore variant-c-album ' +
 'variant-d-home variant-d-explore variant-d-album ' +
 'variant-e-home variant-e-explore variant-e-album ' +
 'variant-f-home variant-f-album ' +
 'variant-s1-album variant-s2-album variant-s3-album variant-s4-album variant-s5-album ' +
 'variant-x1-explore variant-x2-explore variant-x2-album variant-x3-explore ' +
 'variant-x4-badges variant-x5-explore ' +
 'variant-t1-tasks ' +
 'variant-k1-place.html?id=glass-kiln variant-k-ride.html?to=glass-kiln variant-k-ride.html?to=neiwan variant-k-ride.html?to=home variant-k-ride.html?to=neiwan&at=p10&leg=4000 variant-k2-map ' +
 'variant-k3-push variant-k3-push.html?when=rain variant-k4-route.html?id=rail variant-k5-unlock variant-k5-unlock.html?when=night ' +
 'variant-k6-place.html?id=neiwan variant-k7-place.html?id=glass-kiln ' +
 'variant-l1-explore variant-l2-explore variant-l3-album variant-l4-map ' +
 'variant-l5-explore variant-l5-album variant-l6-explore';

const VISION_LIST =
 'vision-family-a vision-family-b vision-family-c ' +
 'vision-event-a vision-event-b vision-event-c ' +
 'vision-plan-a vision-plan-b vision-plan-c ' +
 'vision-health-a vision-health-b vision-health-c';

/* 概念稿。不含 concept-map-tiles：那一張要連網才畫得出圖磚，
   掛在 iframe 裡等 CDN 會把整份稽核拖住，而且它本來就不進任何 demo 流程。 */
const CONCEPT_LIST =
 'concept-map-explore concept-map-home concept-map-footprint concept-map-place ' +
 'concept-map-iso concept-map-styles concept-map-ride ' +
 'concept-friend-list concept-friend-profile concept-friend-send ' +
 'concept-friend-inbox concept-friend-neighbors concept-friend-push';

const SCREENS = (CONCEPT_SCOPE ? CONCEPT_LIST : VISION_SCOPE ? VISION_LIST : MAIN_LIST)
  .split(/\s+/).filter(Boolean).map(function (s) { return /\.html/.test(s) ? s : s + '.html'; });

const deadOut = {};      /* 檔名 → 死按鈕清單 */
const wordOut = {};      /* 檔名 → 禁用詞命中 */
const notBuilt = [];     /* 清單裡有、畫面還沒建 */
const visionSkip = [];   /* body[data-vision]，探索稿不稽核 */
let audited = 0;

/* 一張一張掃。攔截器要在頁面自己的腳本之前裝好，所以先開一個空 iframe、
   在它上面換掉 addEventListener，再把 src 指到真正的畫面。 */
function scanOne(s, done) {
  const fr = document.createElement('iframe');
  let settled = false;
  function finish(state, payload) {
    if (settled) return;
    settled = true;
    fr.remove();
    done(state, payload);
  }
  /* 檔案不存在時 Chrome 換成錯誤頁，onload 不一定照預期發生。給一個上限，
     逾時就當成「還沒建檔」，不讓整份稽核卡在一張沒畫的畫面上。 */
  setTimeout(function () { finish('missing'); }, 20000);

  fr.src = 'about:blank';
  fr.onload = function onblank() {
    fr.onload = null;
    let w = null;
    try { w = fr.contentWindow; } catch (e) {}
    if (!w) return finish('missing');
    const origAdd = w.EventTarget.prototype.addEventListener;
    w.EventTarget.prototype.addEventListener = function (type) {
      if (type === 'click' || type === 'pointerdown') { try { this.__bound = true; } catch (e) {} }
      return origAdd.apply(this, arguments);
    };
    fr.onload = function () {
      let doc = null, win = null;
      try { doc = fr.contentDocument; win = fr.contentWindow; } catch (e) {}
      if (!doc || !doc.documentElement) return finish('missing');
      whenReady(doc, function () {
        /* SHELL 不在 ＝ 這個檔還沒建（載到的是錯誤頁）。不是死按鈕，也不是 FAIL。 */
        let shell = null;
        try { shell = win && win.SHELL; } catch (e) {}
        if (!shell) return finish('missing');
        const isVision = !!(doc.body && doc.body.hasAttribute('data-vision'));
        if (isVision && !SCOPED) return finish('vision');
        let payload;
        try {
          payload = {
            dead: deadClicks(doc),
            words: (SCOPED || isVision || WORD_OK[s]) ? [] : bannedHits(doc),
          };
        } catch (e) {
          payload = { dead: [], words: [] };
        }
        finish('ok', payload);
      });
    };
    fr.src = BASE + s;
  };
  document.getElementById('frames').appendChild(fr);
}

/* 同時開六十幾個 iframe 會讓慢的那幾張互相拖累，而且結果不穩定 ——
   一次最多八張。 */
const POOL = 8;
let cursor = 0, running = 0, finished = 0;

function pump() {
  while (running < POOL && cursor < SCREENS.length) {
    const s = SCREENS[cursor++];
    running++;
    scanOne(s, function (state, payload) {
      running--;
      finished++;
      if (state === 'missing') notBuilt.push(s);
      else if (state === 'vision') visionSkip.push(s);
      else {
        audited++;
        if (payload.dead.length) deadOut[s] = payload.dead;
        if (payload.words.length) wordOut[s] = payload.words;
      }
      if (finished === SCREENS.length) {
        if (SCOPED) report({});
        else runProbes();
      } else pump();
    });
  }
}
pump();

function runProbes() {
  const res = {};
  let n = 0;
  PROBES.forEach(function (p) {
    load(p[0], function (d) {
      if (!d) res[p[0]] = { 錯誤: '讀不到' };
      else { try { res[p[0]] = p[1](d); } catch (e) { res[p[0]] = { 錯誤: e.message }; } }
      if (++n === PROBES.length) report(res);
    });
  });
}

function report(res) {
  const L = [];
  let bad = 0;

  if (VISION_SCOPE)  L.push('（scope=vision：12 張願景探索稿，只跑死按鈕這一段）');
  if (CONCEPT_SCOPE) L.push('（scope=concept：13 張概念稿，只跑死按鈕這一段）');

  L.push('── A 看起來可按、實際沒有行為的元素 ' + '─'.repeat(20));
  const files = Object.keys(deadOut).sort();
  if (!files.length) {
    L.push('  PASS  ' + audited + ' 個畫面，沒有死按鈕');
  } else {
    let total = 0;
    files.forEach(function (f) {
      total += deadOut[f].length;
      L.push('  FAIL  ' + f + '：' + deadOut[f].join('、'));
    });
    L.push('        共 ' + total + ' 個，散在 ' + files.length + ' 個畫面');
    bad += files.length;
  }
  if (notBuilt.length) {
    L.push('  —     尚未建檔 ' + notBuilt.length + ' 張：' + notBuilt.sort().join('、'));
  }
  if (visionSkip.length) {
    L.push('  —     探索稿（未稽核）' + visionSkip.length + ' 張：' + visionSkip.sort().join('、'));
  }

  if (!SCOPED) {
    L.push('');
    L.push('── B 同一個數字在不同畫面一不一致 ' + '─'.repeat(20));
    const groups = {};
    Object.keys(res).forEach(function (page) {
      Object.keys(res[page]).forEach(function (k) {
        (groups[k] = groups[k] || []).push([page, res[page][k]]);
      });
    });
    Object.keys(groups).forEach(function (k) {
      const vals = groups[k].filter(function (x) { return x[1] != null; });
      const uniq = Array.from(new Set(vals.map(function (x) { return String(x[1]); })));
      if (uniq.length <= 1) {
        L.push('  PASS  ' + k + ' = ' + (uniq[0] || '—') +
               '（' + vals.length + ' 個畫面一致）');
      } else {
        bad++;
        L.push('  FAIL  ' + k + ' 有 ' + uniq.length + ' 種說法：');
        vals.forEach(function (x) { L.push('          ' + x[0] + ' → ' + x[1]); });
      }
    });

    L.push('');
    L.push('── C 詞彙禁用（' + BANNED.join('／') + '） ' + '─'.repeat(20));
    const wfiles = Object.keys(wordOut).sort();
    if (!wfiles.length) {
      L.push('  PASS  ' + audited + ' 個畫面的算繪文字裡沒有這幾個詞');
    } else {
      wfiles.forEach(function (f) {
        wordOut[f].slice(0, 8).forEach(function (h) {
          L.push('  FAIL  ' + f + '「' + h.word + '」：…' + h.ctx + '…');
        });
        if (wordOut[f].length > 8) {
          L.push('        ' + f + ' 還有 ' + (wordOut[f].length - 8) + ' 處');
        }
      });
      L.push('        共 ' + wfiles.length + ' 個畫面用到禁用詞');
      bad += wfiles.length;
    }
    Object.keys(WORD_OK).forEach(function (f) {
      L.push('  —     白名單 ' + f + '：' + WORD_OK[f]);
    });
    L.push('  —     白名單 body[data-vision]：探索稿還沒到定稿文案的階段');
  }

  L.push('');
  L.push(bad ? '共 ' + bad + ' 項未通過。' : '全部通過。');
  document.getElementById('out').textContent = L.join('\n');
}
</script>
</body>
</html>
