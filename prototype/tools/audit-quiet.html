<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>叫車畫面變吵 — 防護稽核</title>
<!--
  plan §6 的六條防護承諾裡，跟「幾何」有關的那幾條的自動驗收。

  用法（會等頁面跑完再把結果印出來）：
    chrome --headless=new --allow-file-access-from-files \
           --virtual-time-budget=9000 --dump-dom tools/audit-quiet.html

  為什麼用 iframe 而不是截圖比對：要驗的是「景點有沒有壓到上車點 pin、
  它上方的地址標籤、四顆浮動鈕」，這是元素的幾何關係，不是顏色。
  截圖比對會被霧圖層改掉的底色淹沒，量不到真正想量的東西。
  iframe 在 --allow-file-access-from-files 下同源，拿得到 getBoundingClientRect。
-->
<style>
  body { font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace; margin: 24px; }
  iframe { width: 390px; height: 844px; border: 0; position: absolute; left: -9999px; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<pre id="out">跑中…</pre>
<div id="frames"></div>

<script>
const CASES = [
  ['變體 D（圖層開）', '../screens/variant-d-home.html?layer=on'],
  ['變體 E',          '../screens/variant-e-home.html'],
  ['變體 F（今天）',   '../screens/variant-f-home.html?mode=today'],
];

/* 兩個矩形有沒有重疊，回傳重疊面積（px²）。0 = 沒碰到。 */
function overlap(a, b) {
  const w = Math.min(a.right, b.right) - Math.max(a.left, b.left);
  const h = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
  return (w > 0 && h > 0) ? Math.round(w * h) : 0;
}

function audit(name, doc) {
  const L = [];
  const q = function (s) { return Array.from(doc.querySelectorAll(s)); };
  const r = function (el) { return el.getBoundingClientRect(); };

  const spots = q('.spot');
  const pass = [];
  const fail = [];

  /* ④ 景點數量。
     只有上界是不夠的 —— 0 顆也會過。這份原型真的因此吃過一次虧：
     mock.js 改了一個 id，三個變體同時少掉「今天的地方」那一顆，
     這一條照樣印 PASS。所以下界、可見性、主角在不在，三件事都要驗。 */
  const vis = spots.filter(function (s) {
    const r = s.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  });
  (spots.length >= 1 && spots.length <= 4 ? pass : fail)
    .push('④ 景點數量 ' + spots.length + ' 個（要 1–4）');
  (vis.length === spots.length ? pass : fail)
    .push('④ 其中畫得出來的 ' + vis.length + ' 個');
  const today = spots.filter(function (s) {
    return s.className.indexOf('spot--today') >= 0;
  });
  (today.length === 1 ? pass : fail)
    .push('④ 今天的地方 ' + today.length + ' 顆（要剛好 1）');

  /* ⑤ 不遮住上車點 pin、它上方的地址標籤、四顆浮動鈕 */
  const guarded = [];
  const pin = doc.querySelector('.pin');
  if (pin) {
    guarded.push(['上車點 pin', r(pin)]);
    const lab = pin.querySelector('.pin__label');
    if (lab) guarded.push(['地址標籤', r(lab)]);
  }
  q('.fab').forEach(function (f, i) {
    guarded.push(['浮動鈕 ' + (i + 1) + '（' + (f.className.split(' ')[1] || 'fab') + '）', r(f)]);
  });

  if (guarded.length === 0) {
    fail.push('⑤ 一個受保護元素都沒找到 —— 這條沒有驗到，不是通過');
  }

  /* 小卡也要算。它是圖層打開後自動浮出、面積最大的那一塊，
     只量圖釘不量小卡，等於避開了這條承諾真正要防的東西。 */
  const covers = spots.concat(Array.from(doc.querySelectorAll('.peek.is-on')));

  let hits = 0;
  guarded.forEach(function (g) {
    covers.forEach(function (s) {
      const px = overlap(r(s), g[1]);
      if (px > 0) {
        hits++;
        const who = s.className.indexOf('peek') >= 0
          ? '小卡' : ('景點 #' + (s.dataset.i != null ? s.dataset.i : '?'));
        fail.push('⑤ ' + g[0] + ' 被' + who + '壓住 ' + px + ' px²');
      }
    });
  });
  if (!hits && guarded.length) {
    pass.push('⑤ ' + guarded.length + ' 個受保護元素沒有被景點或小卡覆蓋');
  }

  /* ⑥ 兩種標記不共用元件：class 集合必須完全不相交 */
  const cls = function (els) {
    const set = new Set();
    els.forEach(function (e) {
      e.classList.forEach(function (c) { set.add(c); });
      e.querySelectorAll('*').forEach(function (k) {
        k.classList.forEach(function (c) { set.add(c); });
      });
    });
    return set;
  };
  const pins = q('.pin');
  if (!pins.length || !spots.length) {
    fail.push('⑥ 找不到上下車點 pin 或景點 —— 這條沒有驗到，不是通過');
  } else {
    const a = cls(pins), b = cls(spots);
    const shared = Array.from(a).filter(function (c) { return b.has(c); });
    (shared.length === 0 ? pass : fail)
      .push('⑥ 共用的 class：' + (shared.length ? shared.join(' ') : '無'));
  }

  /* ③ 收合態 sheet 不動：新增內容一律標 data-expand-only */
  const sheet = doc.getElementById('sheet');
  if (!sheet) {
    fail.push('③ 找不到 #sheet —— 這條沒有驗到，不是通過');
  } else if (!sheet.classList.contains('is-collapsed')) {
    /* 以前這個條件寫在每個元素的 filter 裡，所以 sheet 只要不是收合態，
       整條檢查就靜靜回 0 個、照印 PASS。它必須是前置守衛。 */
    fail.push('③ 量測時 sheet 不是收合態 —— 這條沒有驗到，不是通過');
  } else {
    const leaked = q('#sheet [data-expand-only]').filter(function (e) {
      return e.getBoundingClientRect().height > 0;
    });
    (leaked.length === 0 ? pass : fail)
      .push('③ 收合態外洩的展開態元素：' + leaked.length + ' 個');
  }

  L.push('── ' + name + ' ' + '─'.repeat(Math.max(2, 46 - name.length * 2)));
  pass.forEach(function (t) { L.push('  PASS  ' + t); });
  fail.forEach(function (t) { L.push('  FAIL  ' + t); });
  L.push('');
  return { lines: L, bad: fail.length };
}

let done = 0, bad = 0, out = [];
CASES.forEach(function (c, i) {
  const fr = document.createElement('iframe');
  fr.src = c[1];
  fr.onload = function () {
    /* 頁內腳本有些排在 DOMContentLoaded 之後（SHELL.ready），等一拍再量 */
    setTimeout(function () {
      let res;
      try { res = audit(c[0], fr.contentDocument); }
      catch (e) { res = { lines: ['── ' + c[0] + ' 讀不到：' + e.message, ''], bad: 1 }; }
      out[i] = res.lines.join('\n');
      bad += res.bad;
      if (++done === CASES.length) {
        document.getElementById('out').textContent =
          out.join('\n') + (bad ? '\n共 ' + bad + ' 條未通過。' : '\n全部通過。');
      }
    }, 600);
  };
  document.getElementById('frames').appendChild(fr);
});
</script>
</body>
</html>
