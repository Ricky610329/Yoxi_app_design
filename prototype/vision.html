<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>願景探索稿 — yoxi 城事</title>
<!--
  願景探索稿的總覽：四個主題 × 三個方向。

  這些畫面不在 demo 流程上、不進圍牆稽核，每張只放一個主意，其餘照抄最近的既有畫面。
  資料在 js/catalog.js 的 VISIONS；縮圖由 tools/shoot.py 產生，還沒建檔的格子會顯示「尚未建檔」。
-->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/chengshi.css">
<style>
  body { background: var(--yoxi-mist); }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 40px 24px 96px; }
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
  .top h1 { font-size: 34px; font-weight: 800; line-height: 1.15; }
  .top p { color: var(--yoxi-slate); margin-top: 8px; line-height: 1.7; max-width: 56em; }
  .backlink { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }

  .theme { background: #fff; border: 1px solid var(--yoxi-line); border-radius: var(--r-card); padding: 24px; margin-bottom: 20px; scroll-margin-top: 16px; }
  .theme__h { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .theme__t { font-size: 22px; font-weight: 800; }
  .theme__lead { font-size: 14px; color: var(--yoxi-slate); }

  .dirs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 1000px) { .dirs { grid-template-columns: 1fr; } }
  .dir { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: start; }
  .fr {
    position: relative; width: 150px; height: calc(150px * 912 / 430);
    border-radius: 12px; overflow: hidden; background: var(--yoxi-mist);
    box-shadow: 0 2px 10px rgba(6,32,64,.14); display: grid; place-items: center;
    font-size: 12px; font-weight: 800; color: var(--yoxi-slate); text-align: center;
  }
  .fr img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .fr a { position: absolute; inset: 0; }
  .dir__code { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--yoxi-red); }
  .dir__n { font-size: 17px; font-weight: 800; margin-top: 2px; line-height: 1.3; }
  .dir__one { font-size: 14px; color: var(--yoxi-navy); margin-top: 8px; line-height: 1.6; }
  .dir__q { font-size: 13px; color: var(--yoxi-slate); margin-top: 8px; line-height: 1.5; }
  .dir__q b { color: var(--yoxi-navy); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 800; background: var(--yoxi-mist); color: var(--yoxi-slate); }
  .tag--risk { background: var(--yoxi-cream); color: #8A5A1E; }
  .tag--todo { background: #DCE3EA; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>願景探索稿</h1>
      <p>四個主題各三種呈現。每張只放一個主意，其餘照抄既有畫面；右上有「探索稿」角標，不在 demo 流程上、不進圍牆稽核。
      看的是「可能的作法」，不是完成的功能。</p>
    </div>
    <div style="display:grid; gap:10px; justify-items:end">
      <a class="backlink" href="index.html"><span class="arrow arrow--left"></span> demo 首頁</a>
      <a class="backlink" href="overview.html?node=visions">在層級樹裡看 <span class="arrow"></span></a>
    </div>
  </header>
  <div id="themes"></div>
</div>

<script src="js/catalog.js"></script>
<script>
(function () {
  document.getElementById('themes').innerHTML = CATALOG.VISIONS.map(function (th) {
    return '<section class="theme" id="' + th.theme + '">' +
      '<div class="theme__h"><h2 class="theme__t">' + th.title + '</h2><span class="theme__lead">' + th.lead + '</span></div>' +
      '<div class="dirs">' + th.dirs.map(function (d) {
        const thumb = d.href ? CATALOG.thumbOf(d.href) : null;
        return '<div class="dir">' +
          '<div class="fr">' +
            (thumb ? '<img src="' + thumb + '" alt="' + d.name + '" loading="lazy" onerror="this.remove()">' : '') +
            '<span>尚未建檔</span>' +
            (d.href ? '<a href="' + d.href + '" target="_blank" aria-label="' + d.name + '"></a>' : '') +
          '</div>' +
          '<div>' +
            '<div class="dir__code">' + th.theme.toUpperCase() + '-' + d.code.toUpperCase() + '</div>' +
            '<div class="dir__n">' + d.name + '</div>' +
            '<p class="dir__one">' + d.one + '</p>' +
            '<p class="dir__q"><b>回答什麼：</b>' + d.answers + '</p>' +
            '<div class="tags"><span class="tag">' + d.where + '</span>' +
              (d.risk || []).map(function (r) { return '<span class="tag tag--risk">' + r + '</span>'; }).join('') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>' +
    '</section>';
  }).join('');
})();
</script>
</body>
</html>
