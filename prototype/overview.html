<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全景圖 — yoxi 城事</title>
<!--
  全景圖：一次看到所有主線畫面，依所屬分頁分組。

  三條 demo 流程（附縮圖與講稿）在 index.html，這裡不再重複一份。
  畫面清單來自 js/catalog.js；縮圖由 tools/shoot.py 產生，改了畫面重跑一次即可。

  不用 iframe 的原因：這頁有數十格，iframe 會變成數百個子資源請求，
  載入慢而且常常有幾格還沒畫完就被看到空白 —— 在比賽現場的筆電上更不可靠。

  直接雙擊開啟即可，不需要伺服器。
-->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/chengshi.css">
<style>
  body { background: var(--yoxi-mist); }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 40px 24px 96px; }

  .top { display: flex; align-items: flex-end; justify-content: space-between;
         gap: 24px; flex-wrap: wrap; margin-bottom: 8px; }
  .top h1 { font-size: 34px; font-weight: 800; line-height: 1.15; }
  .top p { color: var(--yoxi-slate); margin-top: 8px; line-height: 1.7; }
  .backlink { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }

  /* 分頁式目錄：點一下跳到那一組 */
  .toc { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 8px; }
  .toc a {
    display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
    border-radius: 999px; background: #fff; border: 1px solid var(--yoxi-line);
    font-size: 13px; font-weight: 800;
  }
  .toc a:hover { border-color: var(--yoxi-navy); }
  .toc a i { font-style: italic; color: var(--yoxi-slate); font-weight: 800; }

  /* --- 縮圖 --------------------------------------------------------
     寬度抽成 --tw，高度由圖的長寬比（430:912）算出來，
     不手填才不會因為差幾個像素而把手機底部裁掉。 */
  :root { --tw: 198px; }
  @media (max-width: 1440px) { :root { --tw: 180px; } }
  @media (max-width: 1180px) { :root { --tw: 164px; } }

  .thumb { width: var(--tw); flex: none; }
  .thumb__frame {
    position: relative; width: var(--tw); height: calc(var(--tw) * 912 / 430);
    border-radius: 14px; overflow: hidden;
    background: #fff; box-shadow: 0 2px 10px rgba(6,32,64,.14);
    transition: transform var(--t-base) var(--ease), box-shadow var(--t-base) var(--ease);
  }
  .thumb:hover .thumb__frame {
    transform: translateY(-4px); box-shadow: 0 10px 28px rgba(6,32,64,.24);
  }
  .thumb__frame img {
    display: block; width: 100%; height: 100%; object-fit: cover; object-position: top;
  }
  .thumb__hit { position: absolute; inset: 0; }
  .thumb__cap { margin-top: 10px; }
  .thumb__id { font-size: 11px; font-weight: 800; font-style: italic; color: var(--yoxi-slate); }
  .thumb__n  { font-weight: 800; line-height: 1.3; margin-top: 1px; }
  .thumb__k  { display: inline-block; margin-top: 5px; padding: 2px 7px;
               border-radius: 3px; font-size: 10px; font-weight: 800; }
  .k-keep { background: #DCE3EA; color: var(--yoxi-slate); }
  .k-mod  { background: var(--yoxi-cream); color: #8A5A1E; }
  .k-new  { background: var(--yoxi-red);   color: #fff; }

  /* --- 分組牆 ------------------------------------------------------ */
  .group { margin-top: 36px; scroll-margin-top: 16px; }
  .group__h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .group__t { font-size: 20px; font-weight: 800; }
  .group__d { font-size: 14px; color: var(--yoxi-slate); }
  .wall { display: flex; flex-wrap: wrap; gap: 20px; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
            font-size: 13px; color: var(--yoxi-slate); }
</style>
</head>

<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>全景圖</h1>
      <p>
        全部 <span id="nScreens">33</span> 張主線畫面（另有 16 張變體畫面在變體比較頁）。<br>
        點任一張開新分頁看實際畫面。三條 demo 流程與講稿在 demo 首頁。
      </p>
    </div>
    <div style="display:grid; gap:10px; justify-items:end">
      <div style="display:flex; gap:18px">
        <a class="backlink" href="index.html"><span class="arrow arrow--left"></span> demo 首頁</a>
        <a class="backlink" href="variants.html">變體比較 <span class="arrow"></span></a>
      </div>
      <div class="legend">
        <span><i class="thumb__k k-keep">沿用</i> 原封不動</span>
        <span><i class="thumb__k k-mod">改造</i> 小幅修改</span>
        <span><i class="thumb__k k-new">新增</i> 全新</span>
      </div>
    </div>
  </header>

  <nav class="toc" id="toc"></nav>
  <div id="groups"></div>

</div>

<script src="js/catalog.js"></script>
<script>
(function () {
  function thumb(key) {
    const s = CATALOG.screen(key);
    return '<div class="thumb">' +
      '<div class="thumb__frame">' +
        '<img src="' + s.thumb + '" alt="' + s.name + '" loading="lazy">' +
        '<a class="thumb__hit" href="screens/' + s.href + '" target="_blank" aria-label="' + s.name + '"></a>' +
      '</div>' +
      '<div class="thumb__cap">' +
        '<div class="thumb__id">' + s.id + '</div>' +
        '<div class="thumb__n">' + s.name + '</div>' +
        '<span class="thumb__k k-' + s.kind + '">' + s.kindLabel + '</span>' +
      '</div>' +
    '</div>';
  }

  document.getElementById('toc').innerHTML = CATALOG.GROUPS.map(function (g, i) {
    return '<a href="#g' + i + '">' + g[0] + ' <i>' + g[2].length + '</i></a>';
  }).join('');

  document.getElementById('groups').innerHTML = CATALOG.GROUPS.map(function (g, i) {
    return '<section class="group" id="g' + i + '">' +
      '<div class="group__h">' +
        '<h2 class="group__t">' + g[0] + '</h2>' +
        '<span class="group__d">' + g[1] + '</span>' +
      '</div>' +
      '<div class="wall">' + g[2].map(thumb).join('') + '</div>' +
    '</section>';
  }).join('');

  /* 主線畫面張數：同一個檔案帶不同參數只算一張 */
  const files = {};
  Object.keys(CATALOG.SCREENS).forEach(function (k) {
    files[CATALOG.SCREENS[k][3].replace(/\?.*$/, '')] = 1;
  });
  document.getElementById('nScreens').textContent = Object.keys(files).length;
})();
</script>
</body>
</html>
