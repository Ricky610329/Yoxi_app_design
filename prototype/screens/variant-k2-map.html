<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>探索 · 地圖（變體 K2） — yoxi 城事</title>
<!--
  變體 K2 地圖小卡：兩顆按鈕（轉換點在哪？K 系列）

  轉換點放在哪、為什麼
  ────────────────────
  轉換點在小卡上，一步；代價是每張小卡都在賣車。
  點一個圖釘、小卡浮出來，那一刻使用者剛好知道「這是什麼地方、離我多遠」——
  K 系列裡最短的一步就在這裡：不必先進內容頁，走路與叫車並排擺著，
  兩邊都標時間、叫車那邊標車資。選哪一個是使用者的事，不是版面替他決定的。
  走不到的地方（3 公里以上）走路那格不再是按鈕，只剩「走不到」四個字，
  這時候叫車才變成實心的主要動作 —— 理由是距離，不是促銷。

  跟主線那張差在哪（只差一處）
  ────────────────────────────
  screens/map.html 只差一處：底部小卡從「整張是一個連結」改成
  「上半是內容連結、下半是兩顆動作」（.peek--stack + .peek__acts）。
  地圖底層、圖釘、圖例、兩顆浮動圓鈕、預設開今天的地方，全部原封不動。

  刻意沒有的東西
  ──────────────
  · 沒有折扣、沒有「限時」、沒有點數 —— 叫車那顆只寫時間與車資。
  · 沒有把叫車做成實心紅色：紅色只留給頁首、圖釘與今天的地方。
    走得到的時候，實心的是走路。
  · 沒有在圖釘上直接放叫車入口 —— 地圖本身一個字都不提車。
-->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/chengshi.css">
</head>

<body data-tab="explore" data-status="light" data-time="8:10">
<div class="stage">
  <div class="device">
    <div class="device__screen">

      <header class="hdr-red hdr-red--compact">
        <div class="hdr-red__bar">
          <h1 class="hdr-red__title">探索</h1>
          <nav class="viewtoggle">
            <a href="explore.html">
              <span data-icon="viewCards" style="width:15px;height:15px;display:block"></span>
              卡片
            </a>
            <a class="is-on" href="variant-k2-map.html">
              <span data-icon="viewMap" style="width:15px;height:15px;display:block"></span>
              地圖
            </a>
          </nav>
        </div>
      </header>

      <!-- ===== 地圖 ===== -->
      <div class="map u-fill" data-pan id="mapArea" style="background:var(--map-fog)">

        <!-- 底層：霧地圖的上色 + 道路 -->
        <svg class="map__svg" id="fogLayer" viewBox="0 0 390 560"
             preserveAspectRatio="xMidYMid slice"></svg>

        <!-- 你的位置 -->
        <div class="pin" style="left:46%; top:56%; z-index:7">
          <span class="pin__drop" style="width:38px; height:38px">
            <span data-icon="hail" style="width:20px;height:20px;display:block"></span>
          </span>
        </div>

        <!-- 景點 -->
        <div id="spots"></div>

        <!-- 拉遠看整座城市 -->
        <a class="fab" href="fogmap.html" style="top:12px; right:16px" aria-label="整座城市">
          <span data-icon="zoomOut"></span>
        </a>
        <button class="fab" data-recenter style="top:76px; right:16px" aria-label="定位">
          <span data-icon="locate"></span>
        </button>

        <!-- 圖例。放左下，不擋圖釘。 -->
        <div class="maplegend" style="position:absolute; left:16px; top:12px; z-index:10;
                    display:flex; gap:10px; padding:7px 11px; border-radius:999px;
                    background:rgba(255,255,255,.94); box-shadow:var(--sh-card);
                    font-size:11px; font-weight:700; color:var(--yoxi-slate)">
          <span class="u-row" style="gap:5px">
            <i style="width:12px;height:12px;border-radius:var(--r-btn);background:var(--map-explored);
                      border:1px solid var(--yoxi-line)"></i>去過
          </span>
          <span class="u-row" style="gap:5px">
            <i style="width:12px;height:12px;border-radius:var(--r-btn);
                      background:var(--map-fog); border:1px solid var(--yoxi-line)"></i>還沒
          </span>
        </div>

        <!-- 點圖釘後浮出的小卡。
             K2 的唯一改動：卡片本身不再是一個大連結，而是
             上半（內容 → place.html）＋下半（兩顆動作）。 -->
        <div class="peek peek--stack" id="peek">
          <a class="u-row u-gap2 u-fill" id="peekGo" href="place.html" style="min-width:0">
            <span class="peek__img"></span>
            <span class="u-fill" style="min-width:0">
              <span data-peek-name style="display:block; font-weight:800; line-height:1.3"></span>
              <span data-peek-meta style="display:block; font-size:12px; color:var(--yoxi-slate);
                    margin-top:2px"></span>
              <span data-peek-hook style="display:block; font-size:13px; margin-top:5px;
                    line-height:1.5; overflow:hidden; text-overflow:ellipsis;
                    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical"></span>
            </span>
            <span class="arrow"></span>
          </a>
          <div class="peek__acts" id="peekActs"></div>
        </div>

      </div>

    </div>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/mock.js"></script>
<script src="../js/state.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/interact.js"></script>
<script>
(function () {

  /* ---- 底層：霧地圖的上色 + 道路（與 map.html 完全相同）------------ */
  const cells = SHELL.fogCells(390, 560);

  const roads =
    '<g stroke="#FFF" stroke-width="8" fill="none" opacity=".92">' +
      '<path d="M-10 210 L400 196"/><path d="M-10 340 L400 328"/>' +
      '<path d="M112 -10 L132 570"/><path d="M256 -10 L246 570"/>' +
    '</g>' +
    '<g stroke="#FFF" stroke-width="4" fill="none" opacity=".7">' +
      '<path d="M-10 276 L400 266"/><path d="M-10 432 L400 424"/>' +
      '<path d="M188 -10 L200 570"/><path d="M330 -10 L322 570"/>' +
    '</g>' +
    '<g stroke="#C9D8EC" stroke-width="10" fill="none" opacity=".85">' +
      '<path d="M-20 120 Q90 148 180 120 T420 140"/>' +
    '</g>';

  document.getElementById('fogLayer').innerHTML = cells + roads;

  /* ---- 景點圖釘 ---------------------------------------------------- */
  const spots = SHELL.renderSpots(document.getElementById('spots'));

  /* ---- 車資與時間一律算出來，畫面上不寫死 -------------------------- */
  const fareOf  = function (d) { return Math.round(75 + 22 * d / 1000); };
  const carMin  = function (d) { return Math.round(3 + 2.2 * d / 1000); };
  const walkMin = function (d) { return Math.round(d / 75); };

  /* 走得到的界線。超過就不假裝那是一個選項 —— 走路那格變成
     「走不到」的說明文字，叫車才成為實心的主要動作。 */
  const WALKABLE = 3000;

  const peek = document.getElementById('peek');
  const go   = document.getElementById('peekGo');
  const acts = document.getElementById('peekActs');

  const pk = SHELL.bindPeek(peek, spots, {
    onOpen: function (s) {
      go.href = 'place.html?id=' + s.id;

      const walkable = s.dist <= WALKABLE;

      /* btn-primary／btn-ghost 原本的左右 padding 是 20px，兩顆並排時
         「用 yoxi 10 分 · $143」會斷成兩行。這裡收窄並禁止換行。 */
      const fit = ' style="padding:0 10px; white-space:nowrap"';

      const walk = walkable
        ? '<a class="btn-primary"' + fit + ' href="going.html?id=' + s.id + '">走路 ' +
          walkMin(s.dist) + ' 分</a>'
        : '<span style="display:grid; place-items:center; min-height:42px;' +
          ' font-size:var(--fs-sm); font-weight:700; color:var(--yoxi-slate)">走不到</span>';

      const ride =
        '<a class="' + (walkable ? 'btn-ghost' : 'btn-primary') + '"' + fit +
        ' href="variant-k-ride.html?to=' + s.id + '">用 yoxi ' + carMin(s.dist) +
        ' 分 · <span class="num">$' + fareOf(s.dist) + '</span></a>';

      acts.innerHTML = walk + ride;
    },
  });

  /* 預設先開啟今天的地方 —— 一打開就有一個明確的答案 */
  const today = spots.findIndex(function (s) { return s.state === 'today'; });
  if (today >= 0) pk.show(today);
})();
</script>
</body>
</html>
