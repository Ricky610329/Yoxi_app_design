<title>乘車設定 — yoxi 城事</title>
<!--
  乘車設定【改造】
  照 IMG_9563 還原：常用地點／常用旅程／乘車喜好／常用聯絡人。

  唯一的改動：在「常用地點」底下加一列開關「用我的常用地點推薦地方」。
  知情同意的落點應該在資料原生的地方，而不是藏在新功能的設定頁裡 ——
  使用者在設定常用地點的當下，才是最適合問他這個問題的時機。
-->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/chengshi.css">
<style>
  .sw-toggle {
    width: 50px; height: 30px; border-radius: 999px; flex: none;
    background: var(--yoxi-slate-lite); position: relative;
    transition: background var(--t-fast) var(--ease);
  }
  .sw-toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%; background: #fff;
    transition: transform var(--t-fast) var(--ease);
  }
  .sw-toggle.is-on { background: var(--yoxi-navy); }
  .sw-toggle.is-on::after { transform: translateX(20px); }
</style>
</head>
