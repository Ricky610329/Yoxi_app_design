<!--
  CONCEPT-FRIEND-PUSH 好友的推播【概念稿 · 好友】

  這張回答什麼：
  朋友寄了一張明信片給你，手機上會發生什麼事。答案是：預設什麼都不會發生。
  這張畫的是「你自己去打開它」之後的樣子 —— 一天一則，而且是彙整成一句。

  動了什麼：
  · 好友的推播獨立於現有的兩則（早上的地方、晚上的回顧），而且預設是關的。
  · 通知只帶一句話，點下去進信箱，不是進某一張卡 ——
    進到單張卡就等於幫你決定先看誰的。

  刻意沒有的東西：
  · 沒有數字角標
  · 沒有把小語寫在通知裡
  · 沒有「快回他」

  反樣式怎麼躲（見 plan B5）：
  · 通知化 → 預設關；打開也只有一則、彙整成一句，不是一張一則；
    通知上沒有任何可以「處理掉」的動作鍵。
  · 比較感 → 通知裡沒有數字，角標也沒有。
  · 小語變成聊天 → 小語不出現在鎖定畫面；要看就自己打開信箱。

  版型抄 screens/push.html:31-49，那一張是 demo 工具，這一張是概念稿，兩邊都沒動到對方。
-->
