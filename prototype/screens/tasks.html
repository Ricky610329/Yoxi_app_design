<!DOCTYPE html>

<head>

<title>好康任務 — yoxi 城事</title>
<!--
  好康任務【沿用】—— 刻意完全不動

  照 IMG_9565 還原。這一頁是唯一一個「我們刻意不碰」的畫面，
  而且刻意不在裡面放任何城事的入口。

  原因見 plan §8 風險 1：「今天的地方」在結構上跟每日任務同構，
  只要兩者靠太近，使用者就會自動把地方推薦讀成任務，
  接著是罪惡感，接著是退坑 —— 那正是 Pikmin 香菇機制在台灣社群的死法。

  所以這裡是實體隔離：任務有勾選框、有條狀進度、有趟次累積、有期限；
  城事一個都沒有。兩套系統在視覺上完全不共用元件。
-->

<style>
  .task { overflow: hidden; }
  .task + .task { margin-top: 16px; }
  .task__banner {
    height: 104px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px;
    color: var(--yoxi-white); font-weight: 800; text-align: center; line-height: 1.3;
    padding: 0 16px; font-size: 17px;
  }
  .task__banner small {
    font-size: 13px; font-weight: 500; opacity: .92; line-height: 1.4;
  }
  .task__body { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .task__t { font-weight: 800; line-height: 1.4; }
  .task__d { font-size: 13px; color: var(--yoxi-slate); margin-top: 6px; }
  .task__cnt {
    flex: none; text-align: center; padding: 8px 14px;
    border-radius: 4px; background: var(--yoxi-mist);
  }
  .task__cnt small { display: block; font-size: 11px; color: var(--yoxi-slate); }
  .task__cnt b {
    display: block; font-size: 26px; font-weight: 800; font-style: italic;
    line-height: 1.1; margin-top: 2px;
  }
</style>
</head>
