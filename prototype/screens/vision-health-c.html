<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星期四要去健檢 — yoxi 城事</title>
<!--
  HEALTH-C 陪長輩去健檢【願景探索稿】

  一個主意：一條給 60 歲的鏈 ——
  健檢預約 → 敬老愛心車隊 → 回程走一段看一個地方 → 做一張圖傳給家人。
  接的是 yoxi 已有的資產（敬老愛心車隊 7 縣市、無障礙上下車點），
  城事只負責「回程那一段」與「傳給家人那一張」。

  版型照抄 settings.html 的紅頁首（大字標題 + 副標）與 album.html 的白卡列；
  大字排版的語言照抄 elder.html。

  長輩可讀性的紀律（這一張是全站唯一把它寫成規則的畫面）：
  · 可按的東西 3 個（幫你叫車、回程走一段、做一張圖）。返回鍵算導覽，不算在內
  · 沒有分頁 pill、沒有橫向捲動、沒有需要拖曳的東西
  · 字級比全 app 大一級：列標題 20px、副標 16px、卡上的時間 30px，最小 16px
  · 一個畫面一件事的順序：什麼時候 → 怎麼去 → 回來的路上 → 傳給誰
  · 沒有倒數（不寫「還有 3 天」）、沒有提醒紅點、沒有「記得」
  時間與地點來自 MOCK.HEALTH[0]，回程那個地方是 HEALTH[0].nearby[0]。
-->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/chengshi.css">
</head>

<body data-vision="health-c" data-status="light" data-time="9:00">
<div class="stage">
  <div class="device">
    <div class="device__screen">
      <span class="vision-mark">探索稿 · 不在 demo 流程</span>

      <header class="hdr-red">
        <div class="hdr-red__bar">
          <a class="hdr-red__close" data-back href="../vision.html"><span data-icon="close"></span></a>
        </div>
        <h1 class="hdr-red__title" id="hTitle">星期四要去健檢</h1>
        <p class="hdr-red__sub" style="font-size:16px">車和回家的路都排好了</p>
      </header>

      <div class="scroll" style="background:var(--yoxi-mist)">

        <!-- ===== 什麼時候、在哪裡 ===== -->
        <div style="padding:16px">
          <div class="card card--pad">
            <div id="hWhen" style="font-size:30px; font-weight:800; line-height:1.25">
              9月25日 星期四 08:30
            </div>
            <div id="hWhere" style="font-size:20px; font-weight:800; margin-top:8px;
                 color:var(--yoxi-slate)">新竹馬偕</div>
          </div>
        </div>

        <!-- ===== 怎麼去、回來的路上 ===== -->
        <div style="padding:0 16px 16px">
          <div class="card">
            <button class="row-nav" style="padding:18px 16px"
                    data-toast="原型到這裡 —— 實際會用 yoxi 既有的敬老愛心車隊叫車">
              <span class="tile-icon tile-icon--xl">
                <span data-icon="tabRide" style="width:28px;height:28px;display:block"></span>
              </span>
              <span class="row-nav__body">
                <span class="row-nav__title" style="font-size:20px">幫你叫車</span>
                <span class="row-nav__sub" style="font-size:16px" id="fleet">敬老愛心車隊</span>
              </span>
              <span class="arrow"></span>
            </button>

            <a class="row-nav" style="padding:18px 16px" id="backWalk" href="place.html?id=brick">
              <span class="tile-icon tile-icon--xl">
                <span data-icon="place" style="width:28px;height:28px;display:block"></span>
              </span>
              <span class="row-nav__body">
                <span class="row-nav__title" style="font-size:20px">回程走一段，看一個地方</span>
                <span class="row-nav__sub" style="font-size:16px" id="backSub">新竹州廳</span>
              </span>
              <span class="arrow"></span>
            </a>
          </div>
        </div>

        <!-- ===== 傳給家人 ===== -->
        <div style="padding:0 16px 32px">
          <a class="card u-row u-gap4" href="elder.html" style="padding:18px 16px">
            <span class="tile-icon tile-icon--xl">
              <span data-icon="elder" style="width:28px; height:28px; display:block"></span>
            </span>
            <span class="u-fill">
              <span style="display:block; font-size:20px; font-weight:800">做一張圖傳給家人</span>
              <span style="display:block; font-size:16px; color:var(--yoxi-slate); margin-top:4px">
                用你今天去過的地方
              </span>
            </span>
            <span class="arrow"></span>
          </a>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/mock.js"></script>
<script src="../js/state.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/interact.js"></script>
<script>
(function () {
  const H  = MOCK.HEALTH[0];
  const pl = MOCK.findPlace(H.nearby[0]);

  /* 標題只講星期，不講「還有幾天」——  倒數是壓力，星期是提醒。 */
  const wk = (H.at.match(/星期./) || ['這一天'])[0];
  document.getElementById('hTitle').textContent = wk + '要去' + H.kind;
  document.getElementById('hWhen').textContent  = H.at;
  document.getElementById('hWhere').textContent = H.where;
  document.getElementById('fleet').textContent  =
    H.elderFleet ? '敬老愛心車隊' : 'yoxi 一般車';

  document.getElementById('backSub').textContent = pl.name;
  document.getElementById('backWalk').href = 'place.html?id=' + pl.id;

  SHELL.injectIcons();
})();
</script>
</body>
</html>
