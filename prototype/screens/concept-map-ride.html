<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概念稿 · 夜間底圖在行程中 — yoxi 城事</title>
<!--
  概念稿 · 地圖的質感（行程中．夜間底圖）【不在 demo 流程】

  這張回答什麼：夜間底圖擺在 yoxi 的本業畫面裡會是什麼樣子。
  不是為了好看才做夜色 —— 晚上九點四十叫車，白底地圖會刺眼，
  而且深底一上來，紅色才真的只剩下一個意思：你要去的地方。

  怎麼看：?style=navy（預設，也只有這一種 —— 這一頁的立場就是夜間）。
  版型、司機卡、可收合的內容卡、兩顆動作鍵全部沿用 ride.html。

  跟 ride.html 差在哪：
  · 手繪的四條路換成 HSMAP 的夜間底圖（真實幾何）。
  · 行程線是真的兩個座標：東區水利路（24.7990/120.9800）→ 新竹車站，
    中間兩個轉折點是示意的（這份原型沒有做路徑規劃）。
    線用海軍藍粗底 ＋ 白色細芯 —— 在夜間底圖上，純海軍藍會整條不見。
  · 收合的內容卡改成「這條路上」：用 m.spotsAt() 把東門市場放到它真正的位置上，
    卡片與地圖上的那顆圖釘是同一筆資料。
  · 紅色只有一處：下車點的 pin。上車點、行程線、按鈕全部是海軍藍。

  幾何：中心是上車點與下車點的中點（車站東 418 公尺、北 155 公尺），spanM 1600。
  原本規劃的中心與 1300 公尺會把上車點推到畫面右緣，東門市場也整個掉出框外。

  刻意沒有的東西：沒有即時車流、沒有 ETA 倒數、沒有司機頭像照片、
  沒有把內容卡預設展開 —— 位階永遠低於司機資訊。

  資料：地圖資料 © OpenStreetMap 貢獻者（ODbL），右下角有署名。
-->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/chengshi.css">
<link rel="stylesheet" href="../css/concept.css">
<style>
  /* 行程線：夜間底圖上要看得見，所以是「海軍藍粗底 ＋ 白色細芯」 */
  .trip-case { fill: none; stroke: var(--yoxi-navy); stroke-width: 5;
               stroke-linecap: round; stroke-linejoin: round; }
  .trip-core { fill: none; stroke: var(--yoxi-white); stroke-width: 2;
               stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
</style>
</head>

<body data-vision="concept-map-ride" data-status="light" data-time="21:40">
<script>if (/[?&]bare=1/.test(location.search)) document.body.classList.add('is-bare');</script>
<div class="stage">
  <div class="device">
    <div class="device__screen">
      <span class="vision-mark" style="right:auto; left:16px; top:calc(var(--statusbar-h) + 12px)">概念稿 · 質感探索</span>

      <div class="map" data-pan id="mapArea">
        <svg class="map__svg" id="mapSvg"></svg>
        <div id="spots"></div>

        <!-- 上車點（海軍藍） -->
        <div class="pin" id="fromPin" style="left:50%; top:50%; z-index:6">
          <span class="pin__drop" style="width:38px; height:38px">
            <span data-icon="hail" style="width:20px;height:20px;display:block"></span>
          </span>
        </div>

        <!-- 下車點（全頁唯一的紅色） -->
        <div class="pin pin--red" id="toPin" style="left:50%; top:50%; z-index:6">
          <span class="pin__label" style="white-space:nowrap">新竹車站</span>
          <span class="pin__drop"><span data-icon="place"></span></span>
        </div>
      </div>

      <div class="sheet sheet--drag is-collapsed" data-drag>
        <div class="sheet__handle"></div>

        <!-- ===== 媒合中 ===== -->
        <div id="matching">
          <div class="u-row u-gap4" style="padding:8px 0 20px">
            <span class="tile-icon tile-icon--lg">
              <span data-icon="tabRide" style="width:26px;height:26px;display:block"></span>
            </span>
            <span class="u-fill">
              <span style="display:block; font-size:20px; font-weight:800">正在為你找車…</span>
              <span style="display:block; font-size:13px; color:var(--yoxi-slate); margin-top:2px">
                這個時間往車站方向的車比較多
              </span>
            </span>
          </div>
          <a class="btn-ghost" href="concept-map-home.html?style=navy">取消叫車</a>
        </div>

        <!-- ===== 行程中 ===== -->
        <div id="onTrip" class="u-hidden">
          <div class="u-row u-gap4" style="padding-bottom:14px">
            <span class="tile-icon tile-icon--xl">
              <span data-icon="moodGood"
                    style="width:28px; height:28px; display:block; color:var(--yoxi-navy)"></span>
            </span>
            <span class="u-fill">
              <span style="display:block; font-size:18px; font-weight:800">陳先生 · AHB-2836</span>
              <span style="display:block; font-size:13px; color:var(--yoxi-slate); margin-top:2px">
                TOYOTA Corolla Cross · 白色
              </span>
            </span>
            <span style="text-align:right">
              <span style="display:block; font-size:22px; font-weight:800; font-style:italic;
                           line-height:1">6</span>
              <span style="display:block; font-size:11px; color:var(--yoxi-slate)">分鐘後抵達</span>
            </span>
          </div>

          <!-- 這條路上（預設收合，位階低於司機資訊） -->
          <div class="card" style="background:var(--yoxi-cream); border:0">
            <button class="why__head" id="storyToggle" style="padding:14px 16px">
              <span class="u-row u-gap3">
                <span class="peek__img" id="spotThumb"
                      style="width:34px; height:44px; flex:none"></span>
                <span style="text-align:left">
                  <span style="display:block; font-size:12px; color:var(--yoxi-slate);
                               font-weight:700">這條路上</span>
                  <span style="display:block; margin-top:1px" id="spotName"></span>
                </span>
              </span>
              <span class="arrow" id="storyArrow"></span>
            </button>
            <div class="u-hidden" id="storyBody" style="padding:0 16px 16px">
              <p class="story__text" style="font-size:15px" id="spotHook"></p>
              <a class="btn-ghost" id="spotGo" href="concept-map-place.html?id=market"
                 style="margin-top:10px">看看這個地方</a>
              <p class="story__note">
                地圖上那顆圖釘跟這張卡是同一筆資料，位置是它真實的經緯度。
              </p>
            </div>
          </div>

          <div class="u-row u-gap3" style="margin-top:14px">
            <button class="btn-ghost" id="callBtn">聯絡司機</button>
            <button class="demo-btn" style="width:auto; padding:0 16px"
                    data-toast="這份原型的「抵達解鎖」只做了內灣那一段；這一頁只看夜間底圖">
              抵達車站
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/mock.js"></script>
<script src="../js/state.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/interact.js"></script>
<script src="../assets/map/hs-core.js"></script>
<script src="../assets/map/hs-wide.js"></script>
<script src="../assets/map/hs-places.js"></script>
<script src="../js/hsmap.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const FROM = [24.7990, 120.9800];       /* 東區水利路，原型設定的家 */
  const TO   = [24.8014, 120.97168];      /* 新竹車站（hs-places 的座標） */
  /* 中間兩個轉折點是示意的：這份原型沒有做路徑規劃 */
  const VIA  = [[24.79930, 120.97720], [24.80080, 120.97360]];

  /* 定格模式直接跳到行程中：縮圖要拍得到「這條路上」那張卡 */
  const still = q.has('still');
  if (!still) {
    setTimeout(function () {
      document.getElementById('matching').classList.add('u-hidden');
      document.getElementById('onTrip').classList.remove('u-hidden');
    }, 1800);
  } else {
    document.getElementById('matching').classList.add('u-hidden');
    document.getElementById('onTrip').classList.remove('u-hidden');
  }

  document.getElementById('callBtn').onclick = function () {
    SHELL.toast('正在撥號給 陳先生…', { bottom: '24px' });
  };

  const head = document.getElementById('storyToggle');
  const body = document.getElementById('storyBody');
  const arw  = document.getElementById('storyArrow');
  head.onclick = function () {
    const open = !body.classList.contains('u-hidden');
    body.classList.toggle('u-hidden', open);
    arw.style.transform = open ? 'rotate(0deg)' : 'rotate(90deg)';
  };

  SHELL.ready(function () {
    const m = HSMAP.render(document.getElementById('mapSvg'), {
      style: 'navy',
      center: [24.80020, 120.97584],   /* 上下車點的中點，見檔頭 */
      spanM: 1600,
    });

    const pct = function (el, p) {
      el.style.left = (p[0] / m.width * 100).toFixed(1) + '%';
      el.style.top  = (p[1] / m.height * 100).toFixed(1) + '%';
    };
    const a = m.project(FROM[0], FROM[1]);
    const b = m.project(TO[0], TO[1]);
    pct(document.getElementById('fromPin'), a);
    pct(document.getElementById('toPin'), b);

    /* ---- 行程線：粗底＋白芯（夜間底圖上純海軍藍會整條不見）-------------- */
    const NS = 'http://www.w3.org/2000/svg';
    const pts = [a].concat(VIA.map(function (v) { return m.project(v[0], v[1]); })).concat([b]);
    const d = pts.map(function (p, i) {
      return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
    }).join('');
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('data-layer', 'trip');
    ['trip-case', 'trip-core'].forEach(function (cls) {
      const e = document.createElementNS(NS, 'path');
      e.setAttribute('class', cls);
      e.setAttribute('d', d);
      g.appendChild(e);
    });
    m.svg.appendChild(g);

    /* ---- 這條路上：一個景點，卡片與地圖同一筆資料 ---------------------- */
    const ID = 'market';
    const one = m.spotsAt(MOCK.SPOTS, { clamp: true })
      .filter(function (s) { return s.id === ID; });
    SHELL.renderSpots(document.getElementById('spots'), {
      spots: one,
      compact: true,
      href: function (s) { return 'concept-map-place.html?id=' + s.id; },
    });
    if (one.length) {
      const s = one[0];
      document.getElementById('spotName').textContent = s.name;
      document.getElementById('spotHook').textContent =
        '東門市場離下車點四百公尺。' + (s.hook.indexOf('收集於') === 0
          ? '你九月五號來過一次，那天只走了外圈。'
          : s.hook);
      document.getElementById('spotThumb').innerHTML = SHELL.postcardArt(s.art, { seed: 1 });
      document.getElementById('spotGo').href = 'concept-map-place.html?id=' + s.id;
    }

    if (q.has('dbg')) {
      const el = document.createElement('pre');
      el.id = 'dbg';
      el.style.cssText = 'position:fixed;left:0;top:0;z-index:999;font-size:9px;background:#fff';
      el.textContent = 'map ' + m.width + 'x' + m.height +
        '\nfrom ' + a.map(Math.round) + ' to ' + b.map(Math.round) +
        '\nspot ' + one.map(function (s) { return s.id + '@' + s.x + ',' + s.y; }).join(' ');
      document.body.appendChild(el);
    }
  });
})();
</script>
</body>
</html>
