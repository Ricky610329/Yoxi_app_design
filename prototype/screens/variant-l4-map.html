<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>變體 L4 · 地圖極簡 HUD — yoxi 城事</title>
<!--
  變體 L4：地圖極簡 HUD（軸線 load）

  回答什麼問題
    地圖上的浮動介面能少到什麼程度？頁首、卡片／地圖切換、拉遠鈕、圖例
    全部拿掉之後，這張地圖還讀得懂嗎？

  動了什麼（相對 map.html）
    · 沒有紅色頁首，地圖從瀏海一路鋪到分頁列。
    · HUD 只剩一顆定位鈕。拉遠看整座城市那顆拿掉（整座城市改從收藏頁的
      「城市足跡」進），圖例拿掉（灰＝還沒去、上色＝去過，由明信片自己說），
      卡片／地圖切換拿掉。
    · 切回卡片改成往下滑的手勢。原型沒有做那一段，用一行小字加 data-toast
      代替，點下去會回一句話。
    · 小卡不再預設開啟。map.html 一打開就先浮出今天的地方，那張卡本身也是
      一個可按的東西；這一版要等你點一顆圖釘它才出現。

  代價
    · 一打開沒有明確答案 —— map.html 那個「今天去這裡」的預設小卡不見了，
      畫面變成一張要自己找的地圖。
    · 拉遠與切回卡片都靠手勢，發現性低；新使用者不會知道有這兩件事。

  參考了哪個遊戲介面的哪一點
    Pikmin Bloom 的地圖畫面：整屏是地圖，HUD 只有角落幾顆，資訊都等你
    點地面上的東西才浮出來。它的可按數約 6，比主畫面的 12 少一半。

  量出來的數字（tools/audit-load.html）：可按 11（10 個景點＋定位鈕）、到達 1 步。
-->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/chengshi.css">
<style>
  /* 唯一的一行字。不是按鈕，也不是連結 —— 它講的是一個手勢。 */
  .l4-hint {
    position: absolute;
    left: 50%; top: calc(var(--statusbar-h) + 6px);
    transform: translateX(-50%);
    z-index: 12;
    padding: 6px 13px;
    border-radius: var(--r-pill);
    background: rgba(255, 255, 255, .94);
    box-shadow: var(--sh-card);
    font-size: var(--fs-xs);
    font-weight: var(--fw-bold);
    color: var(--yoxi-slate);
    white-space: nowrap;
    cursor: pointer;
  }
</style>
</head>

<body data-tab="explore" data-tabs="l4" data-status="dark" data-time="8:10">
<div class="stage">
  <div class="device">
    <div class="device__screen">

      <!-- ===== 地圖：從瀏海鋪到分頁列 ===== -->
      <div class="map u-fill" data-pan id="mapArea" style="background:var(--map-fog)">

        <svg class="map__svg" id="fogLayer" viewBox="0 0 390 700"
             preserveAspectRatio="xMidYMid slice"></svg>

        <div class="pin" style="left:46%; top:54%; z-index:7">
          <span class="pin__drop" style="width:38px; height:38px">
            <span data-icon="hail" style="width:20px;height:20px;display:block"></span>
          </span>
        </div>

        <div id="spots"></div>

        <!-- HUD 就這一顆 -->
        <button class="fab" data-recenter
                style="top:calc(var(--statusbar-h) + 4px); right:16px" aria-label="定位">
          <span data-icon="locate"></span>
        </button>

        <div class="l4-hint" data-toast="正式版是往下滑回到卡片；這份原型只做到說明這一句">
          往下滑回到卡片
        </div>

        <!-- 點圖釘才浮出來。這一版不預設開啟。 -->
        <a class="peek" id="peek" href="place.html">
          <span class="peek__img"></span>
          <span class="u-fill" style="min-width:0">
            <span data-peek-name style="display:block; font-weight:800; line-height:1.3"></span>
            <span data-peek-meta style="display:block; font-size:12px; color:var(--yoxi-slate);
                  margin-top:2px"></span>
            <span data-peek-hook style="display:block; font-size:13px; margin-top:5px;
                  line-height:1.5; overflow:hidden; text-overflow:ellipsis;
                  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical"></span>
          </span>
          <span class="arrow"></span>
        </a>

      </div>

    </div>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/mock.js"></script>
<script src="../js/state.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/interact.js"></script>
<script>
(function () {

  /* ---- 底層：霧地圖的上色 + 道路。沒有頁首，所以畫布比 map.html 高一截。 ---- */
  const cells = SHELL.fogCells(390, 700);

  const roads =
    '<g stroke="#FFF" stroke-width="8" fill="none" opacity=".92">' +
      '<path d="M-10 262 L400 245"/><path d="M-10 425 L400 410"/>' +
      '<path d="M112 -10 L132 710"/><path d="M256 -10 L246 710"/>' +
    '</g>' +
    '<g stroke="#FFF" stroke-width="4" fill="none" opacity=".7">' +
      '<path d="M-10 345 L400 333"/><path d="M-10 540 L400 530"/>' +
      '<path d="M188 -10 L200 710"/><path d="M330 -10 L322 710"/>' +
    '</g>' +
    '<g stroke="#C9D8EC" stroke-width="10" fill="none" opacity=".85">' +
      '<path d="M-20 150 Q90 185 180 150 T420 175"/>' +
    '</g>';

  document.getElementById('fogLayer').innerHTML = cells + roads;

  /* ---- 景點。最多 10 個，不隨縮放長出來。 ---- */
  const spots = SHELL.renderSpots(document.getElementById('spots'), {
    max: 10, squeeze: 0.9, offset: 6,
  });

  /* ---- 點圖釘 → 小卡。這一版不預先開啟：
         預設開著的小卡本身就是一個可按的東西，極簡 HUD 付不起。 ---- */
  const peek = document.getElementById('peek');
  SHELL.bindPeek(peek, spots, {
    onOpen: function (s) { peek.href = 'place.html?id=' + s.id; },
  });
})();
</script>
</body>
</html>
