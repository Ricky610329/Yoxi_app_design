<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>變體 E · 景點常駐 — yoxi 城事</title>
<!--
  變體 E · 景點常駐 + 一鍵設為下車點（平衡）

  跟變體 D 一樣只有一張地圖，但景點不需要按開關 —— 它們一直在，
  只是極輕：同時最多 4 個、比探索地圖小一號、沒去過的是灰階。

  關鍵的新互動在小卡上：**設為下車點**。點一下就把地點填進下車點欄位、
  sheet 自動展開、叫車按鈕就緒。從「發現一個地方」到「叫車去那裡」只有一步，
  這是整份提案商業轉換路徑的最短版本，而且它把「探索會直接產生訂單」
  從論述變成可以當場點給評審看的動作。

  代價誠實寫在這裡：這是三個變體裡對叫車主畫面干擾最大的一個。
  防護是「同時最多 4 個景點、避開上車點 pin 與四顆浮動鈕、收合態 sheet 不動」。
-->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/chengshi.css">
</head>

<body data-tab="ride" data-tabs="e" data-status="dark" data-time="21:35">
<div class="stage">
  <div class="device">
    <div class="device__screen">

      <!-- ===== 地圖 ===== -->
      <div class="map map--layered" data-pan>
        <svg class="map__svg" viewBox="0 0 390 440" preserveAspectRatio="xMidYMid slice">
          <rect width="390" height="440" fill="var(--map-land)"/>

          <!-- 城事圖層：霧格子墊在道路之下，道路與地名照常疊在上面，
               所以它還是一張地圖，不是棋盤。 -->
          <g id="fogLayer"></g>

          <!-- 水系：頭前溪與客雅溪 -->
          <path d="M-20 96 Q70 118 140 92 T300 108 T420 78" stroke="var(--map-water)"
                stroke-width="13" fill="none" opacity=".85"/>
          <path d="M-20 300 Q90 322 170 296 T410 318" stroke="var(--map-water)"
                stroke-width="9" fill="none" opacity=".7"/>

          <!-- 主要道路 -->
          <g stroke="var(--map-road)" fill="none" stroke-linecap="round">
            <path d="M-10 168 L400 150" stroke-width="11"/>
            <path d="M-10 238 L400 226" stroke-width="9"/>
            <path d="M52 -10 L74 450"   stroke-width="10"/>
            <path d="M196 -10 L212 450" stroke-width="11"/>
            <path d="M320 -10 L308 450" stroke-width="9"/>
            <path d="M-10 390 Q150 360 400 386" stroke-width="8"/>
          </g>

          <!-- 次要道路 -->
          <g stroke="var(--map-road-minor)" stroke-width="5" fill="none">
            <path d="M-10 128 L400 116"/><path d="M-10 200 L400 190"/>
            <path d="M-10 272 L400 262"/><path d="M-10 334 L400 326"/>
            <path d="M120 -10 L136 450"/><path d="M258 -10 L262 450"/>
            <path d="M360 -10 L352 450"/>
          </g>

          <!-- 六家支線鐵路 -->
          <g stroke="#B9BDC4" stroke-width="2.4" fill="none">
            <path d="M344 -10 Q300 140 286 450"/>
          </g>
          <g stroke="#B9BDC4" stroke-width="1" fill="none" stroke-dasharray="2 7">
            <path d="M344 -10 Q300 140 286 450" stroke-width="7"/>
          </g>

          <!-- 地名 -->
          <g font-family="var(--font-sans)" fill="#9AA3AE" font-weight="700">
            <text x="110" y="70"  font-size="15">竹北市</text>
            <text x="214" y="156" font-size="18">新竹縣</text>
            <text x="26"  y="206" font-size="14">北區</text>
            <text x="24"  y="232" font-size="17">新竹市</text>
            <text x="120" y="400" font-size="14">寶山鄉</text>
            <text x="300" y="250" font-size="12"
                  transform="rotate(84 300 250)">六家支線鐵路</text>
          </g>
        </svg>

        <!-- 浮動圓鈕 -->
        <a class="fab fab--navy" href="drawer.html"
           style="top:calc(var(--statusbar-h) + 12px); left:16px" aria-label="選單">
          <span data-icon="menu"></span>
        </a>
        <button class="fab" data-toast="這是 yoxi 現有的掃碼叫車，原型沒有做這一段"
                style="top:calc(var(--statusbar-h) + 16px); right:76px" aria-label="掃碼">
          <span data-icon="scan"></span>
        </button>
        <a class="fab" href="notify.html"
           style="top:calc(var(--statusbar-h) + 16px); right:16px" aria-label="通知">
          <span data-icon="bell"></span>
        </a>
        <button class="fab" data-recenter style="bottom:20px; right:16px" aria-label="定位">
          <span data-icon="locate"></span>
        </button>


        <!-- ===== 城事圖層疊上來的東西 ===== -->
        <div id="spots"></div>

        <!-- 點景點浮出的小卡。bottom 要貼齊地圖下緣（廣告條上方），
             不能沿用探索地圖的 88px —— 那是為了避開 tab bar 算的。 -->
        <div class="peek peek--stack" id="peek" style="bottom:var(--sp-3)">
          <div class="u-row u-gap3">
            <span class="peek__img"></span>
            <span class="u-fill" style="min-width:0">
              <span data-peek-name style="display:block; font-weight:800; line-height:1.3"></span>
              <span data-peek-meta style="display:block; font-size:12px;
                    color:var(--yoxi-slate); margin-top:2px"></span>
              <span data-peek-hook style="display:block; font-size:13px; margin-top:4px;
                    line-height:1.45; overflow:hidden; text-overflow:ellipsis;
                    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical"></span>
            </span>
          </div>
          <div class="peek__acts">
            <a class="btn-ghost" id="peekGo" href="place.html">看看這個地方</a>
            <button class="btn-primary" id="setDrop">設為下車點</button>
          </div>
        </div>


        <!-- 上車點 pin -->
        <div class="pin" style="left:50%; top:62%">
          <span class="pin__label">
            東區水利路 46 巷 58 號
            <svg width="14" height="14" viewBox="0 0 24 24">
              <path d="M3 17.2V21h3.8L18 9.8 14.2 6 3 17.2ZM20.7 6.9a1 1 0 0 0 0-1.4l-2.2-2.2a1 1 0 0 0-1.4 0l-1.8 1.8L19.1 8.7Z"
                    fill="var(--yoxi-red)"/>
            </svg>
          </span>
          <span class="pin__drop"><span data-icon="hail"></span></span>
          <span class="pin__dot"></span>
        </div>
      </div>

      <!-- ===== 廣告輪播條 =====
           第 1 格改為「今天的地方」。這個位置原本就是促銷位，
           不與叫車主路徑爭搶，但讓不搭車的人有一個被動觸點。 -->
      <div class="banner">
        <a class="banner__item" href="place.html" style="background:var(--yoxi-navy)">
          <span style="width:52px;height:52px;border-radius:4px;overflow:hidden;position:relative;flex:none"
                data-art="glass" data-seed="1" data-wide></span>
          <span style="flex:1;min-width:0;color: var(--yoxi-white)">
            <span style="display:block;font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.8">
              今天的地方 · 離你 900m
            </span>
            <span style="display:block;font-size:14px;font-weight:800;margin-top:2px">
              這條巷子 1970 年是全街最亮的地方
            </span>
          </span>
          <span class="arrow arrow--onred"></span>
        </a>

        <div class="banner__item">
          <span style="flex:1;font-size:15px;font-weight:800;color:var(--yoxi-navy)">
            <span style="color:var(--yoxi-red)">點</span>從天降 ·
            趟趟送最高 <span class="num" style="color:var(--yoxi-red);font-size:19px">99</span> 點
          </span>
        </div>
      </div>

      <!-- ===== 底部 sheet =====
           收合態內容與順序完全保留，一個像素都沒動。 -->
      <div class="sheet sheet--drag is-collapsed" data-drag id="sheet" style="--sheet-min:420px">
        <div class="sheet__handle"></div>

        <h1 class="sheet__greet">晚安，Rick 今天要去哪?</h1>

        <div class="card">
          <div class="route-input">
            <div class="route-input__rail">
              <span class="route-input__dot"></span>
              <span class="route-input__line"></span>
              <span class="route-input__dot route-input__dot--to"></span>
            </div>
            <div class="route-input__fields">
              <a class="route-input__field" href="pickup.html">
                <span style="flex:1;min-width:0">
                  <span class="route-input__label" style="display:block">上車點</span>
                  <span class="route-input__value" style="display:block">東區水利路 46 巷 58 號</span>
                </span>
                <svg width="16" height="16" viewBox="0 0 24 24" style="flex:none">
                  <path d="M3 17.2V21h3.8L18 9.8 14.2 6 3 17.2ZM20.7 6.9a1 1 0 0 0 0-1.4l-2.2-2.2a1 1 0 0 0-1.4 0l-1.8 1.8L19.1 8.7Z"
                        fill="var(--yoxi-navy)"/>
                </svg>
              </a>
              <a class="route-input__field" href="pickup.html">
                <span class="route-input__value route-input__value--ph">請輸入下車點可預估車資</span>
              </a>
            </div>
          </div>

          <!-- 【新增】展開態才出現的一列。收合態看不到。 -->
          <div class="divider" data-expand-only></div>
          <a class="row-nav" data-expand-only href="place.html" style="padding:12px 16px">
            <span class="tile-icon" style="width:40px;height:40px;border-radius:14px">
              <span data-icon="place" style="width:22px;height:22px;display:block"></span>
            </span>
            <span class="row-nav__body">
              <span class="row-nav__title" style="font-size:15px">今天的地方 · 900m</span>
              <span class="row-nav__sub">水利路的老玻璃窯</span>
            </span>
            <span class="arrow"></span>
          </a>
        </div>

        <div class="u-row" style="justify-content:space-between; margin-top:16px">
          <a class="btn-pill" href="#" data-toast="這是 yoxi 現有的功能，這份原型沒有改動它">
            <span data-icon="plane" style="width:18px;height:18px;display:block"></span>
            機場接送
          </a>
          <a class="btn-link" href="pickup.html">
            略過下車地點，繼續叫車
            <span class="arrow"></span>
          </a>
        </div>

        <!-- 展開態才出現：設好下車點之後的叫車按鈕 -->
        <a class="btn-primary" id="goBtn" data-expand-only href="ride.html"
           style="margin-top:16px">選好下車點就可以叫車</a>
      </div>

    </div>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/mock.js"></script>
<script src="../js/state.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/interact.js"></script>
<script>
(function () {

  /* 疊在叫車地圖上的景點要重新配位。要避開的東西有四組：
     ① 上車點 pin（50%, 62%）
     ② 它上方那條橫跨 x28–72%、y44–55% 的地址標籤
     ③ 左上漢堡、右上掃碼／鈴鐺、右下定位四顆浮動鈕
     ④ 底部浮出的小卡（約佔地圖下緣 40%）
     剩下的淨空區就是上半部與左側邊緣。 */
  /* 座標是「底邊中心」，單位是地圖框的百分比（這兩個變體的地圖實高 390x404）。
     這四個位置不是挑好看的，是從稽核量到的受保護矩形反推出來的空隙：
       漢堡鈕 x4.1–19.5 y16.3–31.2 ／ 掃碼鈕 x67.2–80.5 y17.3–30.2
       鈴鐺鈕 x82.6–95.9 y17.3–30.2 ／ 定位鈕 x82.6–95.9 y82.2–95.0
       地址標籤 x27.5–72.5 y34.1–43.4 ／ 上車點 pin x44.1–55.9 y44.9–62.0
       小卡展開後 y60.4 以下
     改任何一個數字都要重跑 tools/audit-quiet.html。 */
  const POS = { 'glass-kiln': [38, 32], market: [17, 44], moat: [84, 45], hill: [26, 57] };
  const NEAR = SHELL.nearSpots(POS);

  const mapEl = document.querySelector('.map');
  document.getElementById('fogLayer').innerHTML = SHELL.fogCells(390, 440);

  const spots = SHELL.renderSpots(document.getElementById('spots'),
    { spots: NEAR, compact: true });

  const peek = document.getElementById('peek');

  /* 景點常駐：不需要開關 */
  mapEl.classList.add('layer-on');

  const drop  = document.getElementById('setDrop');
  const field = document.querySelectorAll('.route-input__value')[1];
  let current = null;

  const pk2 = SHELL.bindPeek(peek, spots, {
    onOpen: function (s) {
      document.getElementById('peekGo').href = 'place.html?id=' + s.id;
      current = s;
    },
  });

  /* 設為下車點 → 填欄位 → 展開 sheet → 叫車按鈕就緒。
     這一步是整個變體存在的理由。 */
  drop.onclick = function () {
    if (!current) return;
    field.textContent = current.name;
    field.classList.remove('route-input__value--ph');
    pk2.close();

    const sheet = document.getElementById('sheet');
    sheet.classList.remove('is-collapsed');
    document.getElementById('tabbar')?.classList.add('is-yield');

    const go = document.getElementById('goBtn');
    if (go) { go.textContent = '前往 ' + current.name; go.classList.add('is-ready'); }
  };

  /* 景點常駐，所以不自動跳小卡 —— 一開 app 就彈一張卡片反而吵。
     ?peek=1 是給變體比較頁的縮圖用的，讓那一格看得到兩顆動作。 */
  if (new URLSearchParams(location.search).has('peek')) {
    const t = spots.findIndex(function (s) { return s.state === 'today'; });
    if (t >= 0) pk2.show(t);
  }
})();
</script>
</body>
</html>
