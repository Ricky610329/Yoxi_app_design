<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水利路的老玻璃窯 — yoxi 城事</title>
<!--
  N2 地方詳情（敘事頁）【新增】★核心

  把一個座標變成一個非去不可的理由。

  兩個關鍵設計：
  1. 大圖＝未解鎖明信片的「灰階」版本。去過才會上色 —— 這是整個收集
     動機的視覺支點，比任何進度條都直接。
  2. 資料應用卡逐條列出推薦依據，是給評審看「AI 與官方資料如何落地」的窗口。

  頁尾 CTA 依距離自動判斷主次：900m 以走路為主，28km 以叫車為主。
-->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/chengshi.css">
<style>
  /* 這一頁的特例：頁尾固定 CTA，內容捲動時不遮擋 */
  .place-foot {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 45;
    padding: var(--sp-3) var(--gutter) var(--sp-5);
    background: var(--yoxi-white);
    border-top: 1px solid var(--yoxi-line);
    box-shadow: var(--sh-sheet);
  }
</style>
</head>

<body data-status="light" data-time="8:11">
<div class="stage">
  <div class="device">
    <div class="device__screen">

      <div class="scroll" style="padding-bottom:132px">

        <!-- ===== 未解鎖的明信片（灰階） ===== -->
        <div style="position:relative; height:320px; overflow:hidden; background:var(--yoxi-mist)">
          <div style="position:absolute; inset:0; filter:grayscale(1) contrast(.72) brightness(1.16)"
               data-art="glass" data-seed="1"></div>

          <span class="ai-mark" style="left:16px; bottom:16px">AI 生成示意</span>

          <!-- 未解鎖標記 -->
          <div style="position:absolute; inset:0; display:grid; place-items:center">
            <div style="text-align:center; color:var(--yoxi-slate)">
              <div style="width:44px;height:44px;margin:0 auto 8px;opacity:.55"
                   data-icon="lock"></div>
              <div style="font-size:13px; font-weight:700">到了就會上色</div>
            </div>
          </div>

          <a class="fab" href="explore.html"
             style="top:calc(var(--statusbar-h) + 8px); left:16px; width:44px; height:44px"
             aria-label="返回">
            <span class="arrow arrow--left"></span>
          </a>
        </div>

        <!-- ===== 地點名 ===== -->
        <div style="padding:20px 16px 0">
          <span style="display:inline-block; padding:3px 10px; border-radius:999px;
                       background:var(--yoxi-cream); font-size:12px; font-weight:800">
            工業遺構
          </span>
          <h1 style="font-size:28px; font-weight:800; line-height:1.25; margin-top:10px">
            水利路的老玻璃窯
          </h1>
          <div class="u-row u-gap3" style="margin-top:8px; color:var(--yoxi-slate); font-size:14px">
            <span>離你 <span class="num" style="color:var(--yoxi-navy)">900</span> m</span>
            <span>·</span>
            <span>走路 <span class="num" style="color:var(--yoxi-navy)">12</span> 分鐘</span>
          </div>
        </div>

        <!-- ===== AI 敘事三段 ===== -->
        <div class="story" style="padding:24px 16px" id="story"></div>

        <!-- ===== 資料應用卡 ===== -->
        <div style="padding:0 16px 24px">
          <div class="why">
            <div class="why__head" style="border-bottom:1px solid var(--yoxi-line)">
              <span class="u-row u-gap2">
                <span data-icon="sun" style="width:18px;height:18px;display:block"></span>
                為什麼今天推薦這裡給你
              </span>
            </div>
            <div class="why__list" id="whyList" style="padding-top:12px"></div>
          </div>
        </div>

        <!-- ===== 現場提示 ===== -->
        <div style="padding:0 16px 24px">
          <div class="card card--pad" style="background:var(--yoxi-cream); border:0">
            <div style="font-size:12px; font-weight:800; letter-spacing:.08em;
                        color:var(--yoxi-red); margin-bottom:6px">到了記得看</div>
            <div style="line-height:1.7">
              窯口左側那塊燒到變形的磚，那是溫度超過 1400 度才會有的樣子。
            </div>
            <div style="margin-top:10px; font-size:13px; color:var(--yoxi-slate)">
              戶外空間，全天可看
            </div>
          </div>
        </div>

        <!-- ===== 抵達可得 ===== -->
        <div style="padding:0 16px 32px">
          <div class="sec"><h2 class="sec__t">到了會得到</h2></div>
          <div class="card card--pad u-row u-gap4">
            <span style="width:60px;height:80px;border-radius:4px;overflow:hidden;position:relative;
                         flex:none; filter:grayscale(1) contrast(.72) brightness(1.16)"
                  data-art="glass" data-seed="1"></span>
            <span class="u-fill">
              <span style="display:block; font-weight:800">一張〈水利路的老玻璃窯〉</span>
              <span style="display:block; font-size:13px; color:var(--yoxi-slate); margin-top:2px">
                這個地方獨有，由 AI 依當天的光線與季節生成
              </span>
            </span>
            <span style="position:relative; width:46px; height:46px; flex:none">
              <svg class="ring" width="46" height="46" viewBox="0 0 46 46">
                <circle class="ring__track" cx="23" cy="23" r="20"/>
                <circle class="ring__bar" cx="23" cy="23" r="20"
                        stroke-dasharray="125.6" stroke-dashoffset="100.5"/>
              </svg>
              <span style="position:absolute; inset:0; display:grid; place-items:center;
                           font-size:11px; font-weight:800">
                <span><span class="num">1</span>/5</span>
              </span>
            </span>
          </div>
          <div style="margin-top:8px; font-size:13px; color:var(--yoxi-slate); padding-left:2px">
            也會讓〈風城玻璃〉這枚獎章多收集一張
          </div>
        </div>

      </div>

      <!-- ===== 頁尾 CTA ===== -->
      <div class="place-foot">
        <div style="display:grid; grid-template-columns:1fr auto; gap:8px">
          <a class="btn-primary" href="going.html">走路前往</a>
          <a class="btn-ghost" href="home.html" style="width:auto; padding:0 20px">用 yoxi</a>
        </div>
        <div style="margin-top:8px; text-align:center; font-size:12px; color:var(--yoxi-slate)">
          900 公尺，走過去大概 12 分鐘
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/mock.js"></script>
<script src="../js/shell.js"></script>
<script>
(function () {
  const P = MOCK.TODAY;

  document.getElementById('story').innerHTML = P.story.map(s => `
    <div class="story__block">
      <div class="story__label">${s.label}</div>
      <p class="story__text">${s.text}</p>
    </div>`).join('');

  document.getElementById('whyList').innerHTML = P.why.map(w => `
    <div class="why__item"><span class="why__src">${w.src}</span>${w.text}</div>`).join('');

  SHELL.injectIcons();
})();
</script>
</body>
</html>
