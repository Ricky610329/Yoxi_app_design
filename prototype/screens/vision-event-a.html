<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活動只是來源之一 — yoxi 城事</title>
<!--
  EVENT-A 活動只是來源之一【願景探索稿】

  一個主意：大型活動不另開入口、不另開分頁、不做活動專區。
  它只是「今天的地方」推薦依據裡多出來的一條來源，跟常用地點、天氣、
  收集缺口並排 —— 所以這一張把「為什麼推薦給你」預設攤開，
  讓那一條「大型活動」被看見。

  其餘區塊整段照抄 explore.html（今天的地方大卡、雙 CTA、這個月的路線、
  還沒去的地方），連 inline style 都沒動。

  活動天然有結束日，最容易滑進倒數與限量。所以這一條來源：
  · 只寫日期區間（09.20–10.05），不寫「還剩幾天」「最後一週」
  · 不寫名額、不寫限量、不寫錯過就沒有
  · 今天的地方沒有因為活動而被換掉 —— 它本來就在這裡，活動只是多一個理由
-->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/chengshi.css">
</head>

<body data-vision="event-a" data-tab="explore" data-status="light" data-time="8:10">
<div class="stage">
  <div class="device">
    <div class="device__screen">
      <!-- 頁首右邊已經有卡片／地圖切換，角標往下移到頁首底下 -->
      <span class="vision-mark" style="top:calc(var(--statusbar-h) + 86px)">探索稿 · 不在 demo 流程</span>

      <header class="hdr-red hdr-red--compact">
        <div class="hdr-red__bar">
          <h1 class="hdr-red__title">探索</h1>
          <nav class="viewtoggle">
            <a class="is-on" href="explore.html">
              <span data-icon="viewCards" style="width:15px;height:15px;display:block"></span>
              卡片
            </a>
            <a href="map.html">
              <span data-icon="viewMap" style="width:15px;height:15px;display:block"></span>
              地圖
            </a>
          </nav>
        </div>
      </header>

      <div class="scroll" style="background:var(--yoxi-mist)">

        <!-- ===== 今天的地方 ===== -->
        <div style="background:var(--yoxi-white); padding:16px">
          <a class="placecard" href="place.html">
            <div class="placecard__art" data-art="glass" data-seed="1" data-wide>
              <span class="ai-mark">AI 生成示意</span>
              <span class="placecard__scrim"></span>
              <span class="placecard__body">
                <!-- 【改動】eyebrow 多了一段活動期間。它不是標籤、不是徽章，
                     就是同一行字的後半句。 -->
                <span class="placecard__eyebrow" id="eyebrow">今天的地方 · 城市博覽會期間</span>
                <span class="placecard__name">水利路的老玻璃窯</span>
                <span class="placecard__hook">這條巷子在 1970 年代是全街最亮的地方。</span>
                <span class="placecard__meta">
                  <span>離你 <span class="num">900</span> m</span>
                  <span style="opacity:.5">·</span>
                  <span>走路 <span class="num">12</span> 分鐘</span>
                  <span style="opacity:.5">·</span>
                  <span>工業遺構</span>
                </span>
              </span>
            </div>
          </a>

          <!-- 為什麼推薦給你：AI 的推薦依據。【改動】預設展開。 -->
          <div class="why" style="margin-top:12px">
            <button class="why__head" id="whyToggle">
              <span class="u-row u-gap2">
                <span data-icon="sun" style="width:18px;height:18px;display:block"></span>
                為什麼推薦給你
              </span>
              <span class="arrow" id="whyArrow" style="transform:rotate(90deg)"></span>
            </button>
            <div class="why__list" id="whyList" style="display:grid">
              <div class="why__item"><span class="why__src">常用地點</span>
                你這個月有 3 趟行程從水利路出發，但從沒往北走過那個路口</div>
              <div class="why__item"><span class="why__src">常用時段</span>
                你週日下午通常在家，這是你一週裡最可能出門走走的時段</div>
              <div class="why__item"><span class="why__src">收集缺口</span>
                你的圖鑑裡還沒有任何一張「工業遺構」類的明信片</div>
              <div class="why__item"><span class="why__src">天氣</span>
                今天下午 3–6 點降雨機率 10%，西曬角度正好</div>
            </div>
          </div>

          <!-- 雙 CTA。900m 走得到，所以「走路前往」是主要動作。
               距離 > 10km 時主次自動對調（見 place.html 的內灣） -->
          <div style="display:grid; gap:8px; margin-top:12px">
            <a class="btn-primary" href="going.html">走路前往</a>
            <a class="btn-ghost" href="place.html">先看看這是什麼地方</a>
          </div>
        </div>

        <!-- ===== 這個月的路線 ===== -->
        <div style="padding:20px 16px">
          <div class="sec">
            <h2 class="sec__t">這個月的路線</h2>
            <a class="sec__m u-row u-gap2" href="routes.html">全部 <span class="arrow"></span></a>
          </div>

          <div class="hscroll" id="routeCards"></div>
        </div>

        <!-- ===== 還沒去的地方 =====
             過去推薦過但沒去的，永久保留、永不過期。
             這條清單本身就是「反限時」的展示品。 -->
        <div style="padding:0 16px 24px">
          <div class="sec">
            <h2 class="sec__t">還沒去的地方</h2>
            <a class="sec__m u-row u-gap2" href="map.html">在地圖上看 <span class="arrow"></span></a>
          </div>

          <div class="card" id="pendingList"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/mock.js"></script>
<script src="../js/state.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/interact.js"></script>
<script>
(function () {
  const EV = MOCK.EVENTS[0];

  /* 這個月的路線：進度一律由狀態算，不寫死 */
  document.getElementById('routeCards').innerHTML = MOCK.ROUTES.map(function (r, i) {
    const done = STATE.routeDone(r.id);
    let track = '';
    for (let n = 0; n < r.total; n++) {
      if (n) track += '<i class="track-mini__link' + (n < done ? ' is-done' : '') + '"></i>';
      track += '<i class="track-mini__node' + (n < done ? ' is-done' : '') + '"></i>';
    }
    return '<a class="card" href="route.html?id=' + r.id + '" style="width:240px; flex:none">' +
      '<span style="display:block; height:110px; position:relative; overflow:hidden"' +
      ' data-art="' + r.art + '" data-seed="' + (i + 3) + '" data-wide></span>' +
      '<span style="display:block; padding:12px">' +
        '<span style="display:block; font-weight:800; line-height:1.35">' + r.name.split('：')[0] + '</span>' +
        '<span style="display:block; font-size:13px; color:var(--yoxi-slate); margin-top:2px">' +
          r.sub + '</span>' +
        '<span class="track-mini" style="margin-top:10px">' + track +
        '<span style="margin-left:8px; font-size:12px; color:var(--yoxi-slate)">' +
        '<span class="num">' + done + '</span>/' + r.total + '</span></span>' +
      '</span></a>';
  }).join('');
  SHELL.injectArt(document.getElementById('routeCards'));

  /* 【改動】eyebrow 與推薦依據都掛上活動。活動只出現在這兩個地方。 */
  document.getElementById('eyebrow').textContent = MOCK.TODAY.eyebrow + ' · ' + EV.name + '期間';

  /* 為什麼推薦給你：直接用 MOCK.TODAY.why，不要另抄一份；
     最後多一條「大型活動」。只寫日期區間，不寫剩幾天。 */
  const why = MOCK.TODAY.why.concat([{
    src: '大型活動',
    text: EV.name + ' ' + EV.from + '–' + EV.to + '，這個地方在活動走得到的範圍裡',
  }]);
  document.getElementById('whyList').innerHTML = why.map(function (w) {
    return '<div class="why__item"><span class="why__src">' + w.src + '</span>' + w.text + '</div>';
  }).join('');

  /* 還沒去的地方 */
  const list = document.getElementById('pendingList');
  list.innerHTML = MOCK.PENDING.map((p, i) => `
    <a class="row-nav" href="place.html?id=${p.id}" style="padding:12px 16px">
      <span style="width:46px;height:60px;border-radius:4px;overflow:hidden;position:relative;flex:none"
            data-art="${p.art}" data-seed="${i + 5}"></span>
      <span class="row-nav__body">
        <span class="row-nav__title" style="font-size:16px">${p.name}</span>
        <span class="row-nav__sub">${(p.distance / 1000).toFixed(1)} km · ${p.ago}</span>
      </span>
      <span class="arrow"></span>
    </a>`).join('');
  SHELL.injectArt(list);

  /* 「為什麼推薦給你」收合。這一張預設是展開的，按一下才收起來。 */
  const head = document.getElementById('whyToggle');
  const body = document.getElementById('whyList');
  const arw  = document.getElementById('whyArrow');
  head.onclick = () => {
    const open = body.style.display !== 'none';
    body.style.display = open ? 'none' : 'grid';
    arw.style.transform = open ? 'rotate(0deg)' : 'rotate(90deg)';
  };
})();
</script>
</body>
</html>
