<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>這一週 — yoxi 城事</title>
<!--
  N13 週回顧【新增】

  隱私分軌的另一半：每日日誌完全私密、沒有分享鍵；
  週回顧是唯一可以對外分享的匯總。

  要分享的東西跟要保護的東西，從一開始就分開放 ——
  這樣使用者不必每次都判斷「這個可以給人看嗎」。

  借 Pikmin Bloom 的做法：本週與上週並排對比，用同色系明度差，
  不用兩種對立的顏色。
-->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/chengshi.css">
</head>

<body data-status="light" data-time="21:40">
<div class="stage">
  <div class="device">
    <div class="device__screen">

      <header class="hdr-red hdr-red--compact">
        <div class="hdr-red__bar">
          <a class="hdr-red__close" data-back href="album.html"><span data-icon="close"></span></a>
          <h1 class="hdr-red__title" style="flex:1; margin-left:8px">這一週</h1>
          <a class="hdr-red__action u-row u-gap2" href="#" data-share="分享這一週">
            <span class="ic-ondark" data-icon="share" style="width:18px;height:18px;display:block"></span>
            分享
          </a>
        </div>
      </header>

      <div class="scroll" style="background:var(--yoxi-mist)">
        <p class="ai-note">明信片與插圖都是 AI 依地點生成的示意圖，不是實景照片。</p>


        <!-- 封面：本週明信片拼貼 -->
        <div style="padding:16px">
          <div class="card" style="overflow:hidden">
            <div id="collage"
                 style="display:grid; grid-template-columns:repeat(3,1fr); gap:2px; height:190px"></div>
            <div style="padding:16px">
              <div style="font-size:12px; font-weight:800; letter-spacing:.08em;
                          color:var(--yoxi-red)">9月15日 – 9月21日</div>
              <div style="font-size:21px; font-weight:800; margin-top:5px">
                這一週你去了 <span class="num" id="nWeek">3</span> 個新的地方
              </div>
            </div>
          </div>
        </div>

        <!-- 步數對比：同色系明度差 -->
        <div style="padding:0 16px 16px">
          <div class="card card--pad">
            <div class="sec" style="margin-bottom:14px">
              <h2 class="sec__t sec__t--sm">走了多少</h2>
              <span class="sec__m">跟上週比</span>
            </div>
            <div style="display:flex; align-items:flex-end; gap:10px; height:120px">
              <div id="bars" style="display:flex; align-items:flex-end; gap:8px;
                   flex:1; height:100%"></div>
            </div>
            <div class="u-row u-gap4" style="margin-top:14px; font-size:12px;
                 color:var(--yoxi-slate)">
              <span class="u-row" style="gap:6px">
                <i style="width:12px;height:12px;border-radius:var(--r-btn);
                          background:var(--yoxi-red)"></i>本週 <span id="sumWk"></span> km
              </span>
              <span class="u-row" style="gap:6px">
                <i style="width:12px;height:12px;border-radius:var(--r-btn);
                          background:#FFB9AE"></i>上週 <span id="sumLast"></span> km
              </span>
            </div>
          </div>
        </div>

        <!-- 走過的地方 -->
        <div style="padding:0 16px 8px">
          <div class="card card--pad">
            <div class="sec" style="margin-bottom:12px">
              <h2 class="sec__t sec__t--sm">走過的地方</h2>
            </div>
            <div class="hscroll" id="places"></div>
          </div>
        </div>

        <!-- 心情不在這裡。設定頁把心情列在「只有你」，每日回顧收集到的心情
             不能匯總到唯一可以分享的這一頁 —— 隱私分軌要自己先守住。 -->
        <div style="padding:0 16px 32px">
          <div class="privacy-note" style="padding:4px 2px">
            <span data-icon="lock" style="width:14px;height:14px"></span>
            心情與日誌不會出現在這一頁，分享出去的只有去過的地方與走了多少。
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="../js/icons.js"></script>
<script src="../js/mock.js"></script>
<script src="../js/state.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/interact.js"></script>
<script>
(function () {
  /* 這一週＝ 9/15–9/21。以前是「最後六張」，所以拼貼裡會出現 9/08 護城河、
     9/12 南寮、9/14 竹中這些上一週的地方，而標題又寫死「4 個」——
     標題、拼貼、實際日期三個數字沒有一個對得上。 */
  const inWeek = function (d) { return d >= '09.15' && d <= '09.21'; };
  const got = MOCK.POSTCARDS.filter(function (p) {
    const c = STATE.card(p.id);
    return c && inWeek(c.date);
  });
  document.getElementById('nWeek').textContent = got.length;

  document.getElementById('collage').innerHTML = got.map(function (p) {
    const i = MOCK.POSTCARDS.indexOf(p);
    return '<span style="position:relative; overflow:hidden" data-art="' + p.art +
           '" data-seed="' + i + '" data-wide></span>';
  }).join('');

  /* 步數對比：同色系明度差，不用兩種對立的顏色 */
  /* 週日那一格要跟每日回顧、收藏頁說的今天 4.3 公里一致。
     兩條的總和就是下面圖例寫的公里數，不要各寫各的。 */
  /* 兩週加起來要小於收藏頁「本月 48 公里」。以前是 34.8 + 27.2 = 62，
     兩週比一個月還多。 */
  const wk = [3.1, 2.2, 4.8, 1.6, 3.4, 3.9, 4.3];
  const last = [2.4, 2.9, 3.6, 2.0, 3.1, 2.6, 2.6];
  const sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0).toFixed(1); };
  const day = ['一', '二', '三', '四', '五', '六', '日'];
  const max = 8;
  document.getElementById('sumWk').textContent = sum(wk);
  document.getElementById('sumLast').textContent = sum(last);
  document.getElementById('bars').innerHTML = wk.map(function (v, i) {
    return '<span style="flex:1; display:flex; flex-direction:column; align-items:center;' +
           ' justify-content:flex-end; height:100%; gap:5px">' +
      '<span style="display:flex; align-items:flex-end; gap:2px; width:100%; height:100%;' +
      ' justify-content:center">' +
        '<i style="width:38%; background:#FFB9AE; border-radius:3px 3px 0 0;' +
        ' height:' + (last[i] / max * 100) + '%"></i>' +
        '<i style="width:38%; background:var(--yoxi-red); border-radius:3px 3px 0 0;' +
        ' height:' + (v / max * 100) + '%"></i>' +
      '</span>' +
      '<small style="font-size:11px; color:var(--yoxi-slate)">' + day[i] + '</small>' +
    '</span>';
  }).join('');

  document.getElementById('places').innerHTML = got.map(function (p) {
    const i = MOCK.POSTCARDS.indexOf(p);
    return '<a href="postcard.html?id=' + p.id + '" style="width:76px; flex:none; text-align:center">' +
      '<span style="display:block; width:76px; height:76px; border-radius:6px;' +
      ' overflow:hidden; position:relative" data-art="' + p.art + '" data-seed="' + i +
      '" data-wide></span>' +
      '<span style="display:block; font-size:11px; font-weight:700; margin-top:5px;' +
      ' line-height:1.3">' + p.name + '</span></a>';
  }).join('');

  SHELL.injectArt();
  SHELL.injectIcons();
})();
</script>
</body>
</html>
