  <rect class="node" x="360" y="210" width="480" height="76" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="600.0" y="241.5">查看地方</tspan><tspan x="600.0" y="266.5">特色、推薦理由與前往資訊</tspan></text>
  <rect class="node" x="65" y="350" width="430" height="82" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="280.0" y="384.5">步行前往</tspan><tspan x="280.0" y="409.5">依個人移動需求選擇</tspan></text>
  <rect class="node" x="705" y="350" width="430" height="82" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="920.0" y="384.5">搭 yoxi 前往</tspan><tspan x="920.0" y="409.5">確認目的地與報價</tspan></text>
  <rect class="node" x="360" y="500" width="480" height="82" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="600.0" y="534.5">到訪探索</tspan><tspan x="600.0" y="559.5">核對位置或授權行程證據</tspan></text>
  <rect class="node" x="360" y="640" width="480" height="82" style="fill:#FBEBDF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="600.0" y="674.5">收下當次明信片</tspan><tspan x="600.0" y="699.5">固定規則選款、保存紀錄</tspan></text>
  <rect class="node" x="360" y="780" width="480" height="82" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="600.0" y="814.5">回到個人收藏</tspan><tspan x="600.0" y="839.5">卡片、獎章與城市足跡</tspan></text>
  <rect class="node" x="65" y="930" width="430" height="82" style="fill:#FBEBDF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="280.0" y="964.5">留下自己的回憶卡</tspan><tspan x="280.0" y="989.5">地點模板、照片與心情</tspan></text>
  <rect class="node" x="705" y="930" width="430" height="82" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="920.0" y="964.5">回看與再次探索</tspan><tspan x="920.0" y="989.5">新地方或再次到訪</tspan></text>
  <rect class="node" x="870" y="505" width="290" height="72" style="fill:#EAF1F5"/><text class="" text-anchor="middle" font-size="16" font-weight="500"><tspan x="1015.0" y="534.5">需要時安排回程</tspan><tspan x="1015.0" y="559.5">依可用接送方案</tspan></text>
  <rect class="node" x="870" y="655" width="290" height="72" style="fill:#EAF1F5"/><text class="" text-anchor="middle" font-size="16" font-weight="500"><tspan x="1015.0" y="684.5">自選分享</tspan><tspan x="1015.0" y="709.5">預覽後輸出圖片</tspan></text>
