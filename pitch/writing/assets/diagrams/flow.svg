  <rect class="node" x="90" y="130" width="430" height="70" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="305.0" y="171.0">選定 / 被推薦景點</tspan></text>
  <rect class="node" x="90" y="245" width="430" height="70" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="305.0" y="286.0">確認上下車點與候車安排</tspan></text>
  <rect class="node" x="90" y="360" width="430" height="70" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="305.0" y="401.0">本人確認費用並叫車</tspan></text>
  <rect class="node" x="90" y="475" width="430" height="70" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="305.0" y="516.0">去程接送，抵達依約候車</tspan></text>
  <rect class="node" x="90" y="590" width="430" height="82" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="305.0" y="624.5">100 m 規劃範圍探索</tspan><tspan x="305.0" y="649.5">定位與行程證據驗證</tspan></text>
  <rect class="node" x="90" y="720" width="430" height="82" style="fill:#FBEBDF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="305.0" y="754.5">保證取得當次明信片</tspan><tspan x="305.0" y="779.5">固定規則組合款式</tspan></text>
  <rect class="node" x="565" y="720" width="335" height="82" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="732.5" y="767.0">保存圖鑑、計算里程碑資格</tspan></text>
  <rect class="node" x="90" y="850" width="430" height="70" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="305.0" y="891.0">預覽並選擇分享</tspan></text>
  <rect class="node" x="565" y="475" width="335" height="82" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="732.5" y="509.5">本人選擇回程</tspan><tspan x="732.5" y="534.5">接送與結算</tspan></text>
  <rect class="node" x="290" y="1080" width="400" height="82" style="fill:#FBEBDF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="490.0" y="1114.5">系統分享面板</tspan><tspan x="490.0" y="1139.5">自行選擇 LINE</tspan></text>
  <rect class="node" x="290" y="1315" width="400" height="70" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="490.0" y="1356.0">長輩選對象並傳送圖片</tspan></text>
  <rect class="node" x="290" y="1430" width="400" height="82" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="490.0" y="1477.0">子女看圖、回話或傳貼圖</tspan></text>
  <rect class="node" x="290" y="1560" width="400" height="70" style="fill:#FBEBDF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="490.0" y="1601.0">長輩在 LINE 看回應</tspan></text>
  <text class="" text-anchor="start" font-size="15" font-weight="700"><tspan x="55" y="1000.0">分享出口</tspan></text>
  <text class="" text-anchor="start" font-size="15" font-weight="500"><tspan x="55" y="1035.0">圖片交給系統面板後，App 不知道收件人、已讀或回覆。</tspan></text>
</svg>
