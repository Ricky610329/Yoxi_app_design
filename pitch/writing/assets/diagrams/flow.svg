  <title id="title">遊喜樂使用流程</title>
  <desc id="desc">由原始 Mermaid 區塊離線產生；來源雜湊 5f4f704e81b0681f47e35465ec8e6f056384bba94f2aa16b6e7e6ac89c2b00d7</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#062040"/></marker>
    <style>
      text { font-family: Montserrat, Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif; fill: #062040; }
