  <rect width="100%" height="100%" fill="#FFFFFF"/>
<text class="" text-anchor="start" font-size="25" font-weight="700"><tspan x="35" y="35.0">使用流程：收藏與回程不等待分享結果</tspan></text>
  <rect class="group" x="30" y="55" width="920" height="905"/><text class="" text-anchor="start" font-size="21" font-weight="700"><tspan x="54" y="91.0">App 內：出行與收藏</tspan></text>
  <rect class="group" x="30" y="1250" width="920" height="410"/><text class="" text-anchor="start" font-size="21" font-weight="700"><tspan x="54" y="1286.0">App 外：LINE，不回傳聊天資料</tspan></text>
  <path class="edge" d="M 305.0 200 V 222.5 H 305.0 V 245"/>
  <path class="edge" d="M 305.0 315 V 337.5 H 305.0 V 360"/>
