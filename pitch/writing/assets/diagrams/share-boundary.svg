  <rect class="node" x="55" y="120" width="260" height="76" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="185.0" y="164.0">卡片預覽與圖片輸出</tspan></text>
  <rect class="node" x="355" y="120" width="250" height="76" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="480.0" y="164.0">使用者點擊分享</tspan></text>
  <rect class="node" x="645" y="120" width="300" height="76" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="795.0" y="151.5">己方事件</tspan><tspan x="795.0" y="176.5">輸出、點擊、呼叫狀態</tspan></text>
  <rect class="node" x="305" y="365" width="370" height="82" style="fill:#FBEBDF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="490.0" y="412.0">手機系統分享面板</tspan></text>
  <rect class="node" x="155" y="620" width="300" height="82" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="305.0" y="667.0">LINE 自選對象並傳送</tspan></text>
  <rect class="node" x="525" y="620" width="350" height="82" style="fill:#FBEBDF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="700.0" y="654.5">家人收圖與聊天</tspan><tspan x="700.0" y="679.5">收件人、已讀、回覆不回傳</tspan></text>
  <text class="" text-anchor="middle" font-size="16" font-weight="700"><tspan x="510" y="505.0">責任交接點</tspan></text>
