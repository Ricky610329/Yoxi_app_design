  <title id="title">分享與資料邊界</title>
  <desc id="desc">由原始 Mermaid 區塊離線產生；來源雜湊 b0f4fb467020991fb10f47c608d569a126b54deb02eb41c0c7c8c54f755ff229</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#062040"/></marker>
    <style>
      text { font-family: Montserrat, Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif; fill: #062040; }
      .node { fill: #FFFFFF; stroke: #062040; stroke-width: 2; rx: 8; }
      .group { fill: #FCFDFF; stroke: #778AA4; stroke-width: 1.5; rx: 16; }
      .edge { fill: none; stroke: #062040; stroke-width: 2; marker-end: url(#arrow); }
