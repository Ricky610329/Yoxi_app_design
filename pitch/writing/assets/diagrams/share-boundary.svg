  <rect width="100%" height="100%" fill="#FFFFFF"/>
<text class="" text-anchor="start" font-size="25" font-weight="700"><tspan x="35" y="36.0">分享與量測邊界</tspan></text>
  <rect class="group" x="25" y="60" width="950" height="180"/><text class="" text-anchor="start" font-size="21" font-weight="700"><tspan x="49" y="96.0">我們能處理與量測</tspan></text>
  <rect class="group" x="25" y="560" width="950" height="185"/><text class="" text-anchor="start" font-size="21" font-weight="700"><tspan x="49" y="596.0">App 外：子女資料不回傳 yoxi</tspan></text>
  <path class="edge" d="M 315 158.0 H 335.0 V 158.0 H 355"/>
  <path class="edge" d="M 605 158.0 H 625.0 V 158.0 H 645"/>
  <path class="edge dashed" d="M 480 196 V 365"/><rect class="label-bg" x="526.0" y="298" width="68" height="25" rx="4"/><text class="" text-anchor="middle" font-size="14" font-weight="500"><tspan x="560" y="315.0">移交圖片</tspan></text>
  <path class="edge" d="M 455 661.0 H 490.0 V 661.0 H 525"/>
