  <rect width="100%" height="100%" fill="#FFFFFF"/>
<text class="" text-anchor="start" font-size="25" font-weight="700"><tspan x="35" y="34.0">責任分層：App 內收卡，聊天留在 LINE</tspan></text>
  <rect class="group" x="20" y="45" width="1010" height="415"/><text class="" text-anchor="start" font-size="21" font-weight="700"><tspan x="44" y="81.0">遊喜樂與既有 yoxi</tspan></text>
  <rect class="group" x="20" y="480" width="1010" height="150"/><text class="" text-anchor="start" font-size="21" font-weight="700"><tspan x="44" y="516.0">支援與企業能力</tspan></text>
  <rect class="group" x="20" y="650" width="1010" height="230"/><text class="" text-anchor="start" font-size="21" font-weight="700"><tspan x="44" y="686.0">使用者主動分享後的外部區域</tspan></text>
  <path class="edge" d="M 525.0 143 V 179.0 H 525.0 V 215"/>
  <path class="edge" d="M 525.0 293 V 329.0 H 525.0 V 365"/>
  <path class="edge" d="M 230 535 V 404 H 330"/>
  <path class="edge dashed" d="M 720 104 H 820 V 535"/>
