  <rect class="node" x="330" y="65" width="390" height="78" style="fill:#FBEBDF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="525.0" y="97.5">使用者體驗層</tspan><tspan x="525.0" y="122.5">選景點、看行程、收卡、圖鑑</tspan></text>
  <rect class="node" x="330" y="215" width="390" height="78" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="525.0" y="247.5">遊喜樂服務層</tspan><tspan x="525.0" y="272.5">推薦、到訪驗證、卡片規則</tspan></text>
  <rect class="node" x="330" y="365" width="390" height="78" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="525.0" y="397.5">資料層</tspan><tspan x="525.0" y="422.5">已審內容、本人收藏、必要事件</tspan></text>
  <rect class="node" x="35" y="535" width="390" height="78" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="230.0" y="567.5">內容供給層</tspan><tspan x="230.0" y="592.5">AI 草稿與圖面 → 人工核准</tspan></text>
  <rect class="node" x="625" y="535" width="390" height="78" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="820.0" y="567.5">既有 yoxi 能力</tspan><tspan x="820.0" y="592.5">帳號、出行、車資與支付</tspan></text>
  <rect class="node" x="330" y="665" width="390" height="78" style="fill:#FFFFFF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="525.0" y="697.5">裝置分享出口</tspan><tspan x="525.0" y="722.5">輸出圖片、本人選擇傳送</tspan></text>
  <rect class="node" x="330" y="785" width="390" height="78" style="fill:#FBEBDF"/><text class="" text-anchor="middle" font-size="18" font-weight="500"><tspan x="525.0" y="817.5">App 外：LINE</tspan><tspan x="525.0" y="842.5">家人看圖與聊天，不回傳</tspan></text>
  <text class="" text-anchor="start" font-size="15" font-weight="600"><tspan x="740" y="748.0">跨出 App 後沒有資料回傳線</tspan></text>
