<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">遊喜樂整體系統分層</title>
  <desc id="diagram-desc">App 介面、遊喜樂新增 API、共同資料與內容 AI 後台，以及既有 yoxi 授權接點之間的責任與連接。</desc>
  <defs>
