<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="490" viewBox="0 0 760 490" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">AI 應用方法與人工閘門</title>
  <desc id="diagram-desc">推薦、文字內容與圖像資產三條 AI 管線，包含來源、模型步驟、人工或規則檢查、發布位置與失敗回退。</desc>
  <defs>
